name: Aqua Atman legacy product read-only inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-atman-source-inventory.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/aquathanhxuan-atman-source-inventory.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aquathanhxuan-atman-source-inventory.cjs
