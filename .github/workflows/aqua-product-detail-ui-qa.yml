name: Aqua product details frontend source-target QA
on:
  push:
    branches: [main]
    paths: ['qa-requests/product-detail-ui.json']
permissions:
  contents: read
jobs:
  detail:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/aqua-product-detail-ui-qa.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aqua-product-detail-ui-qa.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-product-detail-ui-parity
          path: artifacts/product-detail-ui
          if-no-files-found: ignore
          retention-days: 14
