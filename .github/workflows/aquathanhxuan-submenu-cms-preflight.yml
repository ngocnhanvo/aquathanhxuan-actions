name: Aqua WordPress Header submenu write-path preflight (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-submenu-cms-preflight.yml'
      - 'scripts/aquathanhxuan-submenu-cms-preflight.cjs'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install matched Playwright driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Inspect approved WP Menu API and category form without writing
        run: node scripts/aquathanhxuan-submenu-cms-preflight.cjs
