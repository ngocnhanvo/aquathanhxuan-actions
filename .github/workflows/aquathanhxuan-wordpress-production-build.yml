name: Aqua Thanh Xuân production build via WordPress

on:
  push:
    branches: [main]
    paths:
      - 'build-requests/*.json'

permissions:
  contents: write

concurrency:
  group: aquathanhxuan-wordpress-production-build-trigger
  cancel-in-progress: false

jobs:
  trigger-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - name: Checkout Aqua Actions request
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve one build request and validated origins
        id: request
        shell: bash
        run: node scripts/aquathanhxuan-resolve-build-request.mjs >> "$GITHUB_OUTPUT"

      - name: Checkout exact Aqua Astro production source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-astro
          persist-credentials: false

      - name: Verify requested Astro source SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          actual="$(git -C source-astro rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_SHA" ]] || {
            echo "::error::Astro master moved; expected=$EXPECTED_SHA actual=$actual"
            exit 1
          }
          echo "SOURCE_SHA_VERIFIED=$actual"

      - name: Install Playwright JavaScript package only
        shell: bash
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0

      - name: Trigger WordPress Build Website and verify production
        id: production
        shell: bash
        env:
          WP_URL: ${{ steps.request.outputs.wp_url }}
          FRONTEND_URL: ${{ steps.request.outputs.frontend_url }}
          EXPECTED_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: node scripts/aquathanhxuan-wordpress-production-build.mjs

      - name: Upload production Header QA screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquathanhxuan-header-production-qa
          path: artifacts/aquathanhxuan-header-production.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Record exact production build request outcome
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const path='chatgpt/aquathanhxuan-build-latest.json';
            const result={
              run_id:context.runId,
              request_source_sha:'${{ steps.request.outputs.source_sha }}',
              production_step:'${{ steps.production.outcome }}',
              checked_at:new Date().toISOString()
            };
            const ref=context.ref.replace('refs/heads/','');
            const existing=await github.rest.repos.getContent({
              owner:context.repo.owner,repo:context.repo.repo,path,ref
            }).catch(e=>e.status===404?null:Promise.reject(e));
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,branch:ref,
              message:'Record Aqua production build result',
              content:Buffer.from(JSON.stringify(result,null,2)+'\n').toString('base64'),
              ...(existing?.data?.sha?{sha:existing.data.sha}:{})
            });
