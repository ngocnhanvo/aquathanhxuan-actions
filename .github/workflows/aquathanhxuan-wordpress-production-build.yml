name: Aqua Thanh Xuân production build via WordPress

on:
  push:
    branches: [main]
    paths:
      - 'build-requests/*.json'

permissions:
  contents: read

concurrency:
  group: aquathanhxuan-wordpress-production-build-trigger
  cancel-in-progress: false

jobs:
  trigger-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - name: Checkout Aqua Actions request
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve one build request and validated origins
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(jq -r '[.commits[] | (.added[]?, .modified[]?)] | unique[]' "$GITHUB_EVENT_PATH" | grep -E '^build-requests/[^/]+\.json$')
          if [[ "${#files[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Aqua build request, found ${#files[@]}"
            exit 1
          fi
          request_file="${files[0]}"
          source_sha="$(jq -r '.source_sha // empty' "$request_file")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid source_sha'; exit 1; }
          python3 - "$request_file" <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys
          from urllib.parse import urlsplit
          request=json.load(open(sys.argv[1], encoding='utf-8'))
          if request.get('environment') != 'production':
              raise SystemExit('Only production request is accepted')
          if request.get('frontend_host') != 'aquathanhxuan.io.vn':
              raise SystemExit('Unexpected frontend host in request')
          vals={}
          for raw in os.environ.get('ENV_FILE','').splitlines():
              m=re.match(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)\s*$', raw)
              if m:
                  vals[m.group(1)] = m.group(2).strip().strip('"\'')
          def origin(key):
              u=urlsplit(vals.get(key,''))
              if (u.scheme!='https' or not u.hostname or u.username or u.password
                  or u.port not in (None,443) or u.path not in ('','/') or u.query or u.fragment):
                  raise SystemExit('Invalid HTTPS origin: '+key)
              return 'https://'+u.hostname, u.hostname
          wp_url,wp_host=origin('WC_URL')
          frontend_url,frontend_host=origin('WC_URL_CLIENT')
          if wp_host != 'admin-aquathanhxuan.io.vn' or frontend_host != 'aquathanhxuan.io.vn':
              raise SystemExit('ENV_FILE does not point to Aqua production')
          print('request_file='+sys.argv[1])
          print('source_sha='+request['source_sha'])
          print('wp_url='+wp_url)
          print('frontend_url='+frontend_url)
          PY
          echo "AQUA_BUILD_REQUEST=$request_file"
          echo "AQUA_EXPECTED_SOURCE_SHA=$source_sha"

      - name: Checkout exact Aqua Astro production source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-astro
          persist-credentials: false

      - name: Verify requested Astro source SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          actual="$(git -C source-astro rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_SHA" ]] || {
            echo "::error::Astro master moved; expected=$EXPECTED_SHA actual=$actual"
            exit 1
          }
          echo "SOURCE_SHA_VERIFIED=$actual"

      - name: Install Playwright JavaScript package only
        shell: bash
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0

      - name: Trigger WordPress Build Website and verify production
        shell: bash
        env:
          WP_URL: ${{ steps.request.outputs.wp_url }}
          FRONTEND_URL: ${{ steps.request.outputs.frontend_url }}
          EXPECTED_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: node scripts/aquathanhxuan-wordpress-production-build.mjs

      - name: Upload production Header QA screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquathanhxuan-header-production-qa
          path: artifacts/aquathanhxuan-header-production.png
          if-no-files-found: ignore
          retention-days: 7
