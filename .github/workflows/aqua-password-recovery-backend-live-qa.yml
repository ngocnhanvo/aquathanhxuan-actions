name: Aqua password recovery backend live negative QA (NO EMAIL / NO RESET)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aqua-password-recovery-backend-live-qa.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/aqua-password-recovery-backend-live-qa.cjs
      - name: Check recovery backend via synthetic invalid inputs only
        run: node scripts/aqua-password-recovery-backend-live-qa.cjs
