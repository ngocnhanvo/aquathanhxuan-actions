name: Aqua verify original missing and colliding brand media
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aqua-brand-asset-diagnostics.yml'
      - 'qa-requests/brand-asset-diagnostics.json'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/aqua-brand-asset-diagnostics.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aqua-brand-asset-diagnostics.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aqua-brands-media-diagnostic
          path: artifacts/brand-asset-diagnostics
          if-no-files-found: ignore
          retention-days: 12
