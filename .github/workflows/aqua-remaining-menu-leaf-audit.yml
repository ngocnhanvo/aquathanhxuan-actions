name: Aqua nine menu source-only submenu gap audit
on:
  push:
    branches: [main]
    paths:
      - audit-requests/remaining-menu-leaf.json
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/aqua-remaining-menu-leaf-audit.py
      - name: Read-only verify six menu leaf labels against original Woo taxonomy and name search
        run: python3 scripts/aqua-remaining-menu-leaf-audit.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-remaining-menu-leaf-audit
          path: artifacts/aqua-remaining-menu-gap/result.json
          retention-days: 14
          if-no-files-found: ignore
