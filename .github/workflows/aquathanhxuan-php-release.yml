name: Aqua Thanh Xuân PHP deployment (manual opt-in)
on:
  push:
    branches: [main]
    paths:
      - 'php-release-requests/*.json'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_PHP to allow WordPress PHP upload (no Astro build)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: aquathanhxuan-wp-php-release
  cancel-in-progress: false
jobs:
  wordpress-php:
    if: >-
      github.repository == 'ngocnhanvo/aquathanhxuan-actions'
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY_PHP'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout AQUATHANHXUAN Actions deploy script
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout only AQUATHANHXUAN WordPress PHP master
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Verify one explicit PHP release request and source SHA (push only)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          before,after=str(event.get('before','')),str(event.get('after',''))
          if event.get('ref') != 'refs/heads/main' or not all(re.fullmatch('[a-f0-9]{40}',v) for v in (before,after)):
              raise SystemExit('Unverified push ref or before/after SHA')
          current=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if current != after or os.environ['GITHUB_SHA'] != after:
              raise SystemExit('Actions checkout differs from push SHA')
          raw=subprocess.check_output(['git','diff','--no-renames','--name-status',before,after,'--','php-release-requests/'],text=True)
          lines=[line.split('\t') for line in raw.strip().splitlines() if line]
          if len(lines)!=1 or lines[0][0] not in ('A','M') or not re.fullmatch(r'php-release-requests/[a-zA-Z0-9._-]+\.json',lines[0][1]):
              raise SystemExit('Exactly one new/updated PHP release request required')
          payload=json.loads(pathlib.Path(lines[0][1]).read_text())
          expected={
              'project':'aquathanhxuan.com','environment':'production',
              'php_source_repo':'ngocnhanvo/aquathanhxuan-php','source_branch':'master',
          }
          if any(payload.get(k)!=v for k,v in expected.items()):
              raise SystemExit('PHP release request targets unexpected project/host/branch')
          requested=payload.get('source_sha','')
          if not isinstance(requested,str) or not re.fullmatch('[a-f0-9]{40}',requested):
              raise SystemExit('Missing exact PHP source SHA')
          source=subprocess.check_output(['git','-C','source-php','rev-parse','HEAD'],text=True).strip()
          if source != requested:
              raise SystemExit('PHP master moved; refusing to deploy unintended SHA')
          print('AQUATHANHXUAN_PHP_RELEASE_REQUEST=PASS source_sha='+source)
          PY
      - name: PHP syntax and project identity
        shell: bash
        run: |
          set -euo pipefail
          php -l source-php/aquathanhxuan-image-delta.php
          php -l source-php/aquathanhxuan-unzip.php
          php source-php/tests/aquathanhxuan-image-delta.php
          php source-php/tests/aquathanhxuan-static-delta.php
          php -l source-php/wp-content/plugins/github-trigger/vcs-build-trigger.php
          php -l source-php/wp-content/plugins/github-trigger/products/endpoint.php
          php source-php/wp-content/plugins/github-trigger/tests/product-log-pagination.test.php
          php -l source-php/wp-content/themes/vibe-code-theme/inc/products/product_endpoint.php
          php source-php/wp-content/themes/vibe-code-theme/tests/product-detail-rest-fields.test.php
          php -l source-php/wp-content/plugins/esc-visual-builder/includes/site-config.php
          php -l source-php/wp-content/plugins/esc-visual-builder/includes/change-index.php
          php -l source-php/wp-content/plugins/esc-visual-builder/includes/text-editor.php
          php -l source-php/wp-content/plugins/esc-visual-builder/includes/text-editor-ui.php
          php source-php/wp-content/plugins/esc-visual-builder/tests/site-config.dynamic.test.php
          php source-php/wp-content/plugins/esc-visual-builder/tests/shared-footer-links-source.test.php
          php source-php/wp-content/plugins/esc-visual-builder/tests/text-image-cells.test.php
          php -l source-php/wp-content/plugins/esc-visual-builder/includes/item-manager.php
          php -l source-php/wp-content/plugins/esc-visual-builder/includes/item-section-ui.php
          php source-php/wp-content/plugins/esc-visual-builder/tests/items-and-sections.test.php
          php source-php/wp-content/plugins/esc-visual-builder/tests/nested-table-item-authorization.test.php
          php source-php/wp-content/plugins/esc-visual-builder/tests/site-config.test.php
          php -l source-php/wp-content/mu-plugins/esc-github-trigger-config.php
          php -l source-php/wp-content/mu-plugins/esc-seo-files.php
          php -l source-php/wp-content/mu-plugins/esc-aqua-cart-promotion.php
          php source-php/tests/aqua-auto-cart-promotion.test.php
          php -l source-php/wp-content/themes/vibe-code-theme/inc/cart/cart_endpoint.php
          php source-php/tests/aqua-cart-coupon-sync.test.php
          php -l source-php/wp-content/themes/vibe-code-theme/inc/checkout/checkout_endpoint.php
          php -l source-php/wp-content/themes/vibe-code-theme/inc/checkout/index.php
          php source-php/tests/aqua-checkout-preflight.test.php
          php source-php/tests/aqua-checkout-idempotency.test.php
          php source-php/tests/aqua-checkout-order-contract.test.php
          php source-php/tests/aqua-onepay-return-safety.test.php
          php source-php/tests/aqua-onepay-context-loader.test.php
          ! grep -Eqi 'nghiencuukhoahoc|EduResearch Hub' source-php/wp-content/mu-plugins/esc-seo-files.php
          php -l source-php/wp-content/plugins/github-trigger/tests/build-status-regression.php
          php source-php/wp-content/plugins/github-trigger/tests/build-status-regression.php
          test "$(cat source-php/aquathanhxuan-unzip-v2.ready)" = 'AQUATHANHXUAN_ASTRO_UNZIP_PROTOCOL=2'
          python3 -m py_compile scripts/aquathanhxuan-php-live-release.py
      - name: Release only AQUATHANHXUAN WordPress PHP files with protected FTPS
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 scripts/aquathanhxuan-php-live-release.py
      - name: Probe configured WordPress unzip ready marker (NO BUILD)
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, ssl, time
          from urllib.parse import urlsplit
          from urllib.request import HTTPSHandler, HTTPRedirectHandler, Request, build_opener
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  return None
          values=[]
          for line in os.environ['ENV_FILE'].splitlines():
              if line.strip().startswith('WC_URL='):
                  values.append(line.split('=',1)[1].strip().strip('"').strip("'"))
          if len(values)!=1:
              raise RuntimeError('Expected one WordPress WC_URL in ENV_FILE')
          parsed=urlsplit(values[0])
          if not (parsed.scheme=='https' and parsed.hostname
              and not parsed.username and not parsed.password and parsed.port in (None,443)
              and parsed.path in ('','/') and not parsed.query and not parsed.fragment):
              raise RuntimeError('Invalid WordPress HTTPS origin in ENV_FILE')
          client=build_opener(HTTPSHandler(context=ssl.create_default_context()),NoRedirect)
          url=parsed.geturl().rstrip('/')+'/aquathanhxuan-unzip-v2.ready'
          for attempt in range(3):
              try:
                  with client.open(Request(url,method='GET'),timeout=20) as response:
                      if response.status==200 and response.read(100).strip()==b'AQUATHANHXUAN_ASTRO_UNZIP_PROTOCOL=2':
                          print('AQUATHANHXUAN_WP_UNZIP_READY_MARKER=PASS')
                          break
              except Exception:
                  pass
              if attempt==2:
                  raise RuntimeError('Configured WP unzip readiness endpoint unavailable')
              time.sleep(3)
          PY
