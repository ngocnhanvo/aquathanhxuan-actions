name: Aqua sale data inventory one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-sale-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect current CMS and legacy sale product fields
        shell: bash
        run: |
          node <<'NODE'
          const clean = (v) => String(v ?? '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
          const get = async (url) => {
            const r = await fetch(url, { headers: { 'cache-control': 'no-cache', 'user-agent': 'AquaSaleInventory/1.2' } });
            if (!r.ok) throw new Error(`HTTP ${r.status} ${url}`);
            return r.json();
          };
          const probe = async (label, url) => {
            const r = await fetch(url, { headers: { 'cache-control': 'no-cache', 'user-agent': 'AquaSaleInventory/1.2' } });
            console.log(label + '_HTTP=' + r.status);
            if (!r.ok) return null;
            const json = await r.json();
            const keys = json && typeof json === 'object' ? Object.keys(json).slice(0, 30) : [];
            console.log(label + '_KEYS=' + JSON.stringify(keys));
            return json;
          };

          const processed = await get('https://aquathanhxuan.io.vn/data/cms-products.json?qa=' + Date.now());
          console.log('PROCESSED_COUNT=' + (Array.isArray(processed) ? processed.length : -1));

          const raw = await get('https://admin.aquathanhxuan.io.vn/wp-json/wp/v2/product?status=publish&per_page=50&page=1&_fields=id,slug,title,price,regular_price,sale_price,on_sale,prices,featured_media_url,acf,class_list&qa=' + Date.now());
          console.log('RAW_COUNT=' + (Array.isArray(raw) ? raw.length : -1));

          const page = await probe(
            'HOME_PAGE',
            'https://admin.aquathanhxuan.io.vn/wp-json/wp/v2/pages/82454?_fields=id,slug,status,content,acf&qa=' + Date.now(),
          );
          if (page) {
            const rendered = String(page?.content?.rendered || '');
            console.log('HOME_PAGE_ID=' + (page?.id ?? ''));
            console.log('HOME_PAGE_SLUG=' + (page?.slug ?? ''));
            console.log('HOME_PAGE_STATUS=' + (page?.status ?? ''));
            console.log('HOME_PAGE_HAS_HOME_00=' + /home_00/i.test(rendered));
            console.log('HOME_PAGE_HAS_HOME_01=' + /home_01/i.test(rendered));
            console.log('HOME_PAGE_RENDERED_TEXT=' + clean(rendered).slice(0, 1000));
          }

          for (const tableId of ['home_00', 'home_01']) {
            const table = await probe(
              'TABLE_' + tableId.toUpperCase(),
              'https://admin.aquathanhxuan.io.vn/wp-json/tablepress/v1/table/' + tableId + '?qa=' + Date.now(),
            );
            if (table) {
              const data = table?.data ?? table?.table?.data ?? null;
              const rows = Array.isArray(data) ? data.length : -1;
              const firstRow = Array.isArray(data) && data.length ? data[0] : null;
              console.log('TABLE_' + tableId.toUpperCase() + '_ROWS=' + rows);
              console.log('TABLE_' + tableId.toUpperCase() + '_FIRST_ROW=' + JSON.stringify(firstRow).slice(0, 2000));
            }
          }

          const legacySale = await get('https://aquathanhxuan.com/wp-json/wc/store/v1/products?on_sale=true&per_page=100&_qa=' + Date.now());
          const legacySummary = (Array.isArray(legacySale) ? legacySale : []).map((p) => ({
            id: p?.id,
            name: clean(p?.name),
            slug: p?.slug,
            permalink: p?.permalink,
            prices: p?.prices,
            images: Array.isArray(p?.images) ? p.images.map((img) => ({
              id: img?.id,
              src: img?.src,
              thumbnail: img?.thumbnail,
              name: img?.name,
              alt: img?.alt,
            })) : [],
            categories: Array.isArray(p?.categories) ? p.categories.map((cat) => ({
              id: cat?.id,
              name: cat?.name,
              slug: cat?.slug,
            })) : [],
            is_purchasable: p?.is_purchasable,
            is_in_stock: p?.is_in_stock,
          }));
          console.log('LEGACY_SALE_COUNT=' + legacySummary.length);
          console.log('LEGACY_SALE_PRODUCTS=' + JSON.stringify(legacySummary));
          NODE


      - name: Probe authenticated WooCommerce REST contract without writes
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          WP_URL="$(python3 - <<'PY'
          import os
          for raw in os.environ.get('ENV_FILE','').splitlines():
              line=raw.strip()
              if line.startswith('export '): line=line[7:].strip()
              if line.startswith('WC_URL='):
                  print(line.split('=',1)[1].strip().strip('"').strip("'").rstrip('/'))
                  break
          PY
          )"
          test "$WP_URL" = "https://admin.aquathanhxuan.io.vn"
          test -n "$WP_ADMIN_USERNAME"
          test -n "$WP_ADMIN_PASSWORD"

          COOKIE_JAR="$RUNNER_TEMP/wp-cookies.txt"
          DASHBOARD="$RUNNER_TEMP/wp-admin.html"
          curl -fsS -c "$COOKIE_JAR" "$WP_URL/wp-login.php" >/dev/null
          curl -fsS -L -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
            --data-urlencode "log=$WP_ADMIN_USERNAME" \
            --data-urlencode "pwd=$WP_ADMIN_PASSWORD" \
            --data-urlencode "wp-submit=Log In" \
            --data-urlencode "redirect_to=$WP_URL/wp-admin/" \
            --data-urlencode "testcookie=1" \
            "$WP_URL/wp-login.php" -o "$DASHBOARD"

          grep -q "wp-admin-bar-my-account" "$DASHBOARD"
          NONCE="$(python3 - "$DASHBOARD" <<'PY'
          import json,re,sys
          html=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          m=re.search(r'wpApiSettings\s*=\s*(\{.*?\})\s*;',html,re.S)
          if m:
              try:
                  print(json.loads(m.group(1)).get('nonce',''))
                  raise SystemExit
              except json.JSONDecodeError:
                  pass
          m=re.search(r'"nonce"\s*:\s*"([A-Za-z0-9]+)"',html)
          print(m.group(1) if m else '')
          PY
          )"
          test -n "$NONCE"

          WC_STATUS="$(curl -sS -o "$RUNNER_TEMP/wc-products.json" -w '%{http_code}' \
            -b "$COOKIE_JAR" -H "X-WP-Nonce: $NONCE" \
            "$WP_URL/wp-json/wc/v3/products?per_page=1&context=edit")"
          WP_STATUS="$(curl -sS -o "$RUNNER_TEMP/wp-products.json" -w '%{http_code}' \
            -b "$COOKIE_JAR" -H "X-WP-Nonce: $NONCE" \
            "$WP_URL/wp-json/wp/v2/product?per_page=1&context=edit")"

          python3 - "$RUNNER_TEMP/wc-products.json" "$RUNNER_TEMP/wp-products.json" "$WC_STATUS" "$WP_STATUS" <<'PY'
          import json,sys
          wc_path,wp_path,wc_status,wp_status=sys.argv[1:]
          def load(path):
              try:
                  return json.load(open(path,encoding='utf-8'))
              except Exception as exc:
                  return {'_parse_error':str(exc)}
          wc,wp=load(wc_path),load(wp_path)
          print('AUTH_LOGIN=PASS')
          print('WC_V3_STATUS='+wc_status)
          print('WP_V2_PRODUCT_STATUS='+wp_status)
          print('WC_V3_SHAPE=' + ('array' if isinstance(wc,list) else 'object'))
          if isinstance(wc,list) and wc:
              print('WC_V3_KEYS='+','.join(sorted(wc[0].keys())))
          elif isinstance(wc,dict):
              print('WC_V3_ERROR_CODE='+str(wc.get('code','')))
              print('WC_V3_ERROR_MESSAGE='+str(wc.get('message',''))[:200])
          print('WP_V2_SHAPE=' + ('array' if isinstance(wp,list) else 'object'))
          if isinstance(wp,dict):
              print('WP_V2_ERROR_CODE='+str(wp.get('code','')))
              print('WP_V2_ERROR_MESSAGE='+str(wp.get('message',''))[:200])
          if wc_status != '200' or wp_status != '200':
              raise SystemExit('Authenticated product REST probe failed')
          PY
