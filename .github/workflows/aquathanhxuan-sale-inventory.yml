name: Aqua sale CMS setup one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-sale-inventory.yml'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - name: Import real Sale products and configure home_01
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import html
          import http.cookiejar
          import json
          import mimetypes
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          def env_value(name):
              for raw in os.environ.get('ENV_FILE', '').splitlines():
                  line = raw.strip()
                  if line.startswith('export '):
                      line = line[7:].strip()
                  if line.startswith(name + '='):
                      return line.split('=', 1)[1].strip().strip('"').strip("'")
              return ''

          WP_URL = env_value('WC_URL').rstrip('/')
          USER = os.environ.get('WP_ADMIN_USERNAME', '')
          PASSWORD = os.environ.get('WP_ADMIN_PASSWORD', '')
          if WP_URL != 'https://admin.aquathanhxuan.io.vn':
              raise SystemExit('Wrong WC_URL: ' + WP_URL)
          if not USER or not PASSWORD:
              raise SystemExit('Missing WordPress admin credentials')

          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          opener.addheaders = [('User-Agent', 'AquaSaleSetup/1.0')]

          def read_text(response):
              return response.read().decode('utf-8', 'replace')

          def open_url(url, data=None, headers=None, method=None, timeout=90):
              req = urllib.request.Request(url, data=data, headers=headers or {}, method=method)
              try:
                  return opener.open(req, timeout=timeout)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', 'replace')
                  raise RuntimeError(f'HTTP {exc.code} {url}: {body[:1000]}') from exc

          open_url(WP_URL + '/wp-login.php').read()
          login_data = urllib.parse.urlencode({
              'log': USER,
              'pwd': PASSWORD,
              'wp-submit': 'Log In',
              'redirect_to': WP_URL + '/wp-admin/',
              'testcookie': '1',
          }).encode()
          dashboard = read_text(open_url(
              WP_URL + '/wp-login.php',
              data=login_data,
              headers={'Content-Type': 'application/x-www-form-urlencoded'},
              method='POST',
          ))
          if 'wp-admin-bar-my-account' not in dashboard:
              raise SystemExit('WordPress login failed')

          nonce_match = re.search(r'wpApiSettings\s*=\s*(\{.*?\})\s*;', dashboard, re.S)
          rest_nonce = ''
          if nonce_match:
              try:
                  rest_nonce = json.loads(nonce_match.group(1)).get('nonce', '')
              except json.JSONDecodeError:
                  pass
          if not rest_nonce:
              nonce_match = re.search(r'"nonce"\s*:\s*"([A-Za-z0-9]+)"', dashboard)
              rest_nonce = nonce_match.group(1) if nonce_match else ''
          if not rest_nonce:
              raise SystemExit('Could not find WP REST nonce')

          def rest_json(path, method='GET', payload=None, raw=None, headers=None):
              request_headers = {'X-WP-Nonce': rest_nonce, 'Accept': 'application/json'}
              if headers:
                  request_headers.update(headers)
              data = raw
              if payload is not None:
                  data = json.dumps(payload, ensure_ascii=False).encode('utf-8')
                  request_headers['Content-Type'] = 'application/json; charset=utf-8'
              response = open_url(WP_URL + path, data=data, headers=request_headers, method=method)
              body = response.read()
              if not body:
                  return None
              return json.loads(body.decode('utf-8'))

          def public_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'AquaSaleSetup/1.0', 'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(req, timeout=90) as response:
                  return json.loads(response.read().decode('utf-8'))

          legacy = public_json('https://aquathanhxuan.com/wp-json/wc/store/v1/products?on_sale=true&per_page=100&_qa=' + str(time.time_ns()))
          if not isinstance(legacy, list) or len(legacy) != 12:
              raise SystemExit(f'Expected 12 legacy Sale products, got {len(legacy) if isinstance(legacy, list) else "invalid"}')
          print('LEGACY_SALE_COUNT=12')

          def fetch_bytes(url, attempts=3):
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'AquaSaleSetup/1.0'})
                      with urllib.request.urlopen(req, timeout=60) as response:
                          data = response.read()
                      if not data:
                          raise RuntimeError('empty response')
                      return data
                  except Exception as exc:
                      last = exc
                      print(f'IMAGE_FETCH_RETRY={attempt} URL={url} ERROR={exc}')
                      if attempt < attempts:
                          time.sleep(attempt)
              raise RuntimeError(f'Image failed after {attempts} attempts: {url}: {last}')

          def exact_media_by_filename(filename):
              stem = os.path.splitext(filename)[0]
              rows = rest_json('/wp-json/wp/v2/media?context=edit&per_page=100&search=' + urllib.parse.quote(stem))
              for row in rows if isinstance(rows, list) else []:
                  src = str(row.get('source_url') or '')
                  current = os.path.basename(urllib.parse.unquote(urllib.parse.urlparse(src).path))
                  if current == filename:
                      return row
              return None

          def ensure_media(src, alt):
              filename = os.path.basename(urllib.parse.unquote(urllib.parse.urlparse(src).path))
              if not filename:
                  raise RuntimeError('Image has no filename: ' + src)
              source_bytes = fetch_bytes(src, 3)
              source_hash = hashlib.sha256(source_bytes).hexdigest()

              existing = exact_media_by_filename(filename)
              if existing:
                  existing_url = str(existing.get('source_url') or '')
                  existing_bytes = fetch_bytes(existing_url, 3)
                  if hashlib.sha256(existing_bytes).hexdigest() != source_hash:
                      raise RuntimeError('Filename collision with different content: ' + filename)
                  media_id = int(existing['id'])
                  rest_json('/wp-json/wp/v2/media/' + str(media_id), method='POST', payload={'alt_text': alt})
                  print(f'MEDIA_REUSED={media_id} FILE={filename}')
                  return media_id

              content_type = mimetypes.guess_type(filename)[0] or 'application/octet-stream'
              media = rest_json(
                  '/wp-json/wp/v2/media',
                  method='POST',
                  raw=source_bytes,
                  headers={
                      'Content-Type': content_type,
                      'Content-Disposition': 'attachment; filename="' + filename.replace('"', '') + '"',
                  },
              )
              media_id = int(media['id'])
              result_url = str(media.get('source_url') or '')
              result_filename = os.path.basename(urllib.parse.unquote(urllib.parse.urlparse(result_url).path))
              if result_filename != filename:
                  try:
                      rest_json('/wp-json/wp/v2/media/' + str(media_id) + '?force=true', method='DELETE')
                  finally:
                      raise RuntimeError(f'WordPress changed filename {filename} -> {result_filename}')
              rest_json('/wp-json/wp/v2/media/' + str(media_id), method='POST', payload={'alt_text': alt})
              print(f'MEDIA_UPLOADED={media_id} FILE={filename}')
              return media_id

          mappings = []
          expected_slugs = []
          for source in legacy:
              source_id = int(source['id'])
              slug = str(source.get('slug') or '').strip()
              name = html.unescape(re.sub(r'<[^>]+>', ' ', str(source.get('name') or ''))).strip()
              prices = source.get('prices') or {}
              regular = str(prices.get('regular_price') or '').strip()
              sale = str(prices.get('sale_price') or prices.get('price') or '').strip()
              if not slug or not name or not regular or not sale or int(sale) >= int(regular):
                  raise RuntimeError(f'Invalid Sale source product {source_id}')
              expected_slugs.append(slug)

              images = source.get('images') if isinstance(source.get('images'), list) else []
              primary = next((img for img in images if img and img.get('src')), None)
              media_id = None
              if primary:
                  alt = html.unescape(str(primary.get('alt') or '')).strip() or name
                  media_id = ensure_media(str(primary['src']), alt)

              matches = rest_json('/wp-json/wc/v3/products?status=any&per_page=100&slug=' + urllib.parse.quote(slug))
              existing = matches[0] if isinstance(matches, list) and matches else None
              payload = {
                  'name': name,
                  'slug': slug,
                  'type': 'simple',
                  'status': 'publish',
                  'catalog_visibility': 'visible',
                  'regular_price': regular,
                  'sale_price': sale,
                  'manage_stock': False,
                  'stock_status': 'instock',
                  'description': str(source.get('description') or ''),
                  'short_description': str(source.get('short_description') or ''),
                  'meta_data': [
                      {'key': '_esc_origin_product_id', 'value': str(source_id)},
                  ],
              }
              if media_id:
                  payload['images'] = [{'id': media_id, 'alt': name}]

              if existing:
                  target = rest_json('/wp-json/wc/v3/products/' + str(existing['id']), method='PUT', payload=payload)
                  action = 'UPDATED'
              else:
                  target = rest_json('/wp-json/wc/v3/products', method='POST', payload=payload)
                  action = 'CREATED'

              target_id = int(target['id'])
              target_images = target.get('images') if isinstance(target.get('images'), list) else []
              if media_id:
                  if not target_images:
                      raise RuntimeError(f'Target product {target_id} lost featured image')
                  first_src = str(target_images[0].get('src') or '')
                  if urllib.parse.urlparse(first_src).netloc != 'admin.aquathanhxuan.io.vn':
                      raise RuntimeError(f'Product {target_id} still hotlinks image: {first_src}')
              if str(target.get('regular_price') or '') != regular or str(target.get('sale_price') or '') != sale:
                  raise RuntimeError(f'Price verification failed for {slug}')

              mappings.append({'source_id': source_id, 'target_id': target_id, 'slug': slug})
              print(f'PRODUCT_{action} SOURCE={source_id} TARGET={target_id} SLUG={slug}')

          if len(mappings) != 12:
              raise RuntimeError('Product mapping count is not 12')

          # Configure ESC Table home_01. Header rows + one config row + 12 product references.
          keys = ['key', 'section_title', 'all_label', 'all_link']
          labels = ['Sản phẩm', 'Tiêu đề khu vực', 'Nhãn xem tất cả', 'Liên kết xem tất cả']
          rows = [
              keys,
              labels,
              ['', 'Sale bùng nổ', 'Xem tất cả ưu đãi', '/san-pham'],
          ]
          rows.extend([[str(item['target_id']), '', '', ''] for item in mappings])
          row_count = len(rows)
          col_count = len(keys)

          try:
              public_json(WP_URL + '/wp-json/tablepress/v1/table/home_01?qa=' + str(time.time_ns()))
              table_id = 'home_01'
              print('TABLE_HOME_01_EXISTS=true')
          except Exception:
              add_html = read_text(open_url(WP_URL + '/wp-admin/admin.php?page=tablepress_add'))
              add_nonce_match = re.search(r'name=["\']_wpnonce["\'][^>]*value=["\']([^"\']+)["\']', add_html, re.I)
              if not add_nonce_match:
                  add_nonce_match = re.search(r'value=["\']([^"\']+)["\'][^>]*name=["\']_wpnonce["\']', add_html, re.I)
              if not add_nonce_match:
                  raise RuntimeError('Could not find ESC Table add nonce')
              add_form = urllib.parse.urlencode({
                  'action': 'tablepress_add',
                  '_wpnonce': add_nonce_match.group(1),
                  'table[name]': 'Trang chủ - Sale',
                  'table[description]': 'Danh sách sản phẩm đang giảm giá trên trang chủ.',
                  'table[rows]': str(row_count),
                  'table[columns]': str(col_count),
              }).encode()
              response = open_url(
                  WP_URL + '/wp-admin/admin-post.php',
                  data=add_form,
                  headers={'Content-Type': 'application/x-www-form-urlencoded'},
                  method='POST',
              )
              edit_html = read_text(response)
              table_match = re.search(r"tp\.table\s*=\s*\{.*?\bid:\s*'([^']+)'", edit_html, re.S)
              if not table_match:
                  table_match = re.search(r'[?&]table_id=([^&"\']+)', response.geturl())
              if not table_match:
                  raise RuntimeError('ESC Table was created but its ID could not be determined')
              table_id = urllib.parse.unquote(table_match.group(1))
              print('TABLE_CREATED_TEMP_ID=' + table_id)

          edit_html = read_text(open_url(
              WP_URL + '/wp-admin/admin.php?page=tablepress&action=edit&table_id=' + urllib.parse.quote(table_id)
          ))
          edit_nonce_match = re.search(r"edit_table:\s*'([^']+)'", edit_html)
          if not edit_nonce_match:
              raise RuntimeError('Could not find ESC Table edit nonce')

          visibility = {
              'rows': [1] * row_count,
              'columns': [1] * col_count,
          }
          save_pairs = [
              ('action', 'tablepress_save_table'),
              ('_ajax_nonce', edit_nonce_match.group(1)),
              ('tablepress[id]', table_id),
              ('tablepress[new_id]', 'home_01'),
              ('tablepress[name]', 'Trang chủ - Sale'),
              ('tablepress[description]', 'Danh sách sản phẩm đang giảm giá trên trang chủ.'),
              ('tablepress[data]', json.dumps(rows, ensure_ascii=False)),
              ('tablepress[options]', '{}'),
              ('tablepress[visibility]', json.dumps(visibility)),
              ('tablepress[number][rows]', str(row_count)),
              ('tablepress[number][columns]', str(col_count)),
              ('custom_api', 'Product'),
              ('custom_image', ''),
              ('custom_cols', ''),
              ('custom_rows', ''),
          ]
          save_body = urllib.parse.urlencode(save_pairs).encode('utf-8')
          save_response = json.loads(read_text(open_url(
              WP_URL + '/wp-admin/admin-ajax.php',
              data=save_body,
              headers={'Content-Type': 'application/x-www-form-urlencoded; charset=utf-8'},
              method='POST',
          )))
          if not save_response.get('success') or save_response.get('table_id') != 'home_01':
              raise RuntimeError('ESC Table save failed: ' + json.dumps(save_response, ensure_ascii=False))
          print('TABLE_HOME_01_SAVE=PASS')

          # Attach the new ESC Table to the real homepage, preserving existing content.
          page = rest_json('/wp-json/wp/v2/pages/82454?context=edit')
          raw_content = str((page.get('content') or {}).get('raw') or '')
          if '[table id=home_00 /]' not in raw_content:
              raise RuntimeError('Homepage no longer contains home_00; refusing to overwrite')
          if '[table id=home_01 /]' not in raw_content:
              new_content = raw_content.rstrip() + '\n\n[table id=home_01 /]'
              rest_json('/wp-json/wp/v2/pages/82454', method='POST', payload={'content': new_content})
              print('HOME_PAGE_SHORTCODE_ADDED=true')
          else:
              print('HOME_PAGE_SHORTCODE_ADDED=false')

          # Public readback proves CMS state before build.
          table = public_json(WP_URL + '/wp-json/tablepress/v1/table/home_01?qa=' + str(time.time_ns()))
          if (table.get('meta') or {}).get('api') != 'Product':
              raise RuntimeError('home_01 meta.api is not Product')
          items = table.get('items') if isinstance(table.get('items'), list) else []
          if len(items) != 13:
              raise RuntimeError(f'home_01 expected 13 items, got {len(items)}')
          table_keys = {str(item.get('key') or '') for item in items}
          expected_target_ids = {str(item['target_id']) for item in mappings}
          if not expected_target_ids.issubset(table_keys):
              raise RuntimeError('home_01 product keys do not match imported products')

          page_public = public_json(WP_URL + '/wp-json/wp/v2/pages/82454?_fields=id,content&qa=' + str(time.time_ns()))
          rendered = str((page_public.get('content') or {}).get('rendered') or '')
          if 'home_01' not in rendered:
              raise RuntimeError('Homepage public content does not expose home_01')

          target_products = rest_json('/wp-json/wc/v3/products?status=publish&per_page=100')
          target_by_slug = {str(p.get('slug') or ''): p for p in target_products if isinstance(p, dict)}
          missing = [slug for slug in expected_slugs if slug not in target_by_slug]
          if missing:
              raise RuntimeError('Missing target products: ' + ','.join(missing))

          print('CMS_WRITE_PASS=true')
          print('TARGET_SALE_PRODUCT_COUNT=12')
          print('HOME_01_ITEMS=13')
          print('PRODUCT_MAPPING=' + json.dumps(mappings, ensure_ascii=False))
          PY
