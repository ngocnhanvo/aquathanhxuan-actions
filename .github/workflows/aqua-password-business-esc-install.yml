name: Aqua password Pages native ESC Table install (CMS only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aqua-password-business-esc-install.yml'
      - 'scripts/aqua-password-business-esc-install.cjs'
permissions:
  contents: read
concurrency:
  group: aqua-password-business-cms-pages
  cancel-in-progress: false
jobs:
  native-tables:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate CMS write script
        run: node --check scripts/aqua-password-business-esc-install.cjs
      - name: Install matched Playwright driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Insert native ESC Tables on the two existing WordPress Pages
        run: node scripts/aqua-password-business-esc-install.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-password-native-esc-install
          path: artifacts/aqua-password-esc/
          if-no-files-found: ignore
          retention-days: 14
