name: Aqua remaining catalog completed batch read-only QA
on:
  push:
    branches: [main]
    paths:
      - qa-requests/remaining-catalog-early.json
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      AQUA_QA_DATA_ONLY: '1'
      # Batch scope comes from qa-requests/remaining-catalog-early.json.
      AQUA_QA_REQUEST_PATH: qa-requests/remaining-catalog-early.json
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/aqua-remaining-catalog-production-qa.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Independently compare completed product batches including source SEO
        run: node scripts/aqua-remaining-catalog-production-qa.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-remaining-catalog-early-qa
          path: artifacts/aqua-remaining-catalog-production/report.json
          retention-days: 14
          if-no-files-found: ignore
