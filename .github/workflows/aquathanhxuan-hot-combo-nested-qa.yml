name: Aqua Hot Combo nested section production QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qa-requests/hot-combo-nested-*.json'
      - 'scripts/aquathanhxuan-hot-combo-nested-qa.cjs'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/aquathanhxuan-hot-combo-nested-qa.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aquathanhxuan-hot-combo-nested-qa.cjs
