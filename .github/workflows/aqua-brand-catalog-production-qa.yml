name: Aqua all brands source-target production parity QA
on:
  push:
    branches: [main]
    paths:
      - 'qa-requests/brand-catalog-production.json'
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/aqua-brand-catalog-production-qa.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aqua-brand-catalog-production-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aqua-all-brands-parity-qa
          path: artifacts/brand-catalog-qa
          if-no-files-found: ignore
          retention-days: 12
