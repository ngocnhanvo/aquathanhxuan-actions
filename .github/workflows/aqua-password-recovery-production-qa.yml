name: Aqua password recovery production browser QA (SAFE READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aqua-password-recovery-production-qa.yml'
      - 'scripts/aqua-password-recovery-production-qa.cjs'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect browser QA syntax
        run: node --check scripts/aqua-password-recovery-production-qa.cjs
      - name: Install matching Playwright driver without downloading browser
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Test recovery pages and flows, mock email sending and password writes
        run: node scripts/aqua-password-recovery-production-qa.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-password-recovery-browser-evidence
          path: artifacts/aqua-password-recovery/
          if-no-files-found: ignore
          retention-days: 14
