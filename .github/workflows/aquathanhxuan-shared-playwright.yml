name: Aqua Thanh Xuân shared Playwright (manual, read-only)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      suite:
        description: 'Read-only browser test'
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - wordpress-site-health
          - wordpress-build-trigger-audit
permissions:
  contents: read

jobs:
  configured-origins:
    name: Read validated site origins from ENV_FILE
    runs-on: ubuntu-latest
    outputs:
      frontend_url: ${{ steps.origins.outputs.frontend_url }}
      frontend_host: ${{ steps.origins.outputs.frontend_host }}
      wordpress_url: ${{ steps.origins.outputs.wordpress_url }}
      wordpress_host: ${{ steps.origins.outputs.wordpress_host }}
    steps:
      - name: Resolve only approved HTTPS origins
        id: origins
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          vals={}
          for line in os.environ.get('ENV_FILE','').splitlines():
              line=line.strip()
              if line.startswith('export '): line=line[7:].strip()
              for name in ('WC_URL','WC_URL_CLIENT'):
                  if line.startswith(name+'='):
                      if name in vals: raise SystemExit('Duplicate origin configuration')
                      vals[name]=line.split('=',1)[1].strip().strip('"').strip("'")
          if set(vals)!={'WC_URL','WC_URL_CLIENT'}:
              raise SystemExit('Missing WordPress or frontend origin')
          result={}
          for key,label in (('WC_URL','wordpress'),('WC_URL_CLIENT','frontend')):
              parsed=urlsplit(vals[key])
              if (parsed.scheme!='https' or not parsed.hostname or parsed.username or parsed.password
                  or parsed.port not in (None,443) or parsed.path not in ('','/')
                  or parsed.query or parsed.fragment):
                  raise SystemExit('Invalid site origin: '+label)
              result[label+'_url']='https://'+parsed.hostname
              result[label+'_host']=parsed.hostname
          if result['wordpress_host']==result['frontend_host']:
              raise SystemExit('WordPress/frontend origins must be isolated')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              for key,value in result.items():out.write(key+'='+value+'\n')
          print('AQUATHANHXUAN_PLAYWRIGHT_ORIGINS=PASS; sourced_from=ENV_FILE; no credentials logged')
          PY

  public-smoke:
    needs: configured-origins
    name: Test AQUATHANHXUAN public website
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message == 'test: trigger read-only AQUATHANHXUAN public smoke') || (github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke')
    uses: ngocnhanvo/knowledge-actions/.github/workflows/playwright.yml@main
    with:
      site_url: ${{ needs.configured-origins.outputs.frontend_url }}
      expected_hostname: ${{ needs.configured-origins.outputs.frontend_host }}
      suite: smoke

  wordpress-site-health:
    needs: configured-origins
    name: Test AQUATHANHXUAN WordPress Site Health without disclosing DB_NAME
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'wordpress-site-health') || (github.event_name == 'push' && github.event.head_commit.message == 'test: trigger read-only AQUATHANHXUAN WordPress site health')
    uses: ngocnhanvo/knowledge-actions/.github/workflows/playwright.yml@main
    with:
      site_url: ${{ needs.configured-origins.outputs.wordpress_url }}
      expected_hostname: ${{ needs.configured-origins.outputs.wordpress_host }}
      suite: wordpress-site-health
      # Optional tenant-specific DB fingerprints come from GitHub repository Variables.
      # Never embed a cloned site's original database identity in a reusable workflow.
      expected_db_sha256: ${{ vars.AQUATHANHXUAN_EXPECTED_DB_SHA256 }}
      disallowed_db_sha256: ${{ vars.AQUATHANHXUAN_DISALLOWED_DB_SHA256 }}
    secrets:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}

  wordpress-build-trigger-audit:
    needs: configured-origins
    name: Read-only audit of AQUATHANHXUAN WP Build Website dashboard
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'wordpress-build-trigger-audit') || (github.event_name == 'push' && github.event.head_commit.message == 'test: trigger read-only AQUATHANHXUAN build UI audit')
    uses: ngocnhanvo/knowledge-actions/.github/workflows/playwright.yml@main
    with:
      site_url: ${{ needs.configured-origins.outputs.wordpress_url }}
      expected_hostname: ${{ needs.configured-origins.outputs.wordpress_host }}
      suite: wordpress-build-trigger-audit
    secrets:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}

  wordpress-sitemap-save-regression:
    needs: configured-origins
    name: Verify AQUATHANHXUAN sitemap settings save on production WordPress
    if: >-
      github.event_name == 'push' &&
      github.event.head_commit.message == 'test: verify Aqua Thanh Xuan sitemap save'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 8
    env:
      SITE_URL: ${{ needs.configured-origins.outputs.wordpress_url }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install matching Playwright driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Submit current sitemap settings without changing values
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');

          (async () => {
            const origin = String(process.env.SITE_URL || '').replace(/\/+$/, '');
            const user = process.env.WP_ADMIN_USERNAME || '';
            const pass = process.env.WP_ADMIN_PASSWORD || '';
            assert(origin.startsWith('https://'), 'Missing validated WordPress origin');
            assert(user && pass, 'Missing WordPress admin credentials');

            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            try {
              await page.goto(origin + '/wp-login.php', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.locator('#user_login').fill(user);
              await page.locator('#user_pass').fill(pass);
              await Promise.all([
                page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 30000 }),
                page.locator('#wp-submit').click(),
              ]);
              assert(!page.url().includes('wp-login.php'), 'WordPress login did not complete');

              await page.goto(origin + '/wp-admin/options-general.php?page=esc-seo-files&tab=sitemap', {
                waitUntil: 'domcontentloaded', timeout: 30000,
              });
              const action = page.locator('input[name="action"][value="esc_seo_files_save"]');
              assert.equal(await action.count(), 1, 'SEO Files sitemap form not found');
              const form = action.locator('xpath=ancestor::form[1]');
              const submit = form.locator('#submit');
              assert.equal(await submit.count(), 1, 'SEO Files save button not found');

              await Promise.all([
                page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 30000 }),
                submit.click(),
              ]);

              const current = new URL(page.url());
              const body = await page.locator('body').innerText();
              assert(!body.includes('Đã xảy ra lỗi nghiêm trọng'), 'WordPress critical error after sitemap save');
              assert.equal(current.pathname, '/wp-admin/options-general.php', 'Save did not redirect back to SEO Files');
              assert.equal(current.searchParams.get('page'), 'esc-seo-files', 'Save returned to wrong admin page');
              assert.equal(current.searchParams.get('tab'), 'sitemap', 'Save returned to wrong tab');
              assert.equal(current.searchParams.get('updated'), '1', 'Save did not report updated=1');
              assert(body.includes('Đã lưu cấu hình'), 'Success notice missing after sitemap save');
              console.log('AQUATHANHXUAN_SITEMAP_SAVE_REGRESSION=PASS');
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error('AQUATHANHXUAN_SITEMAP_SAVE_REGRESSION=FAIL:', error.message);
            process.exit(1);
          });
          NODE
