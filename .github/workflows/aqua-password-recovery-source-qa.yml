name: Aqua customer password recovery source QA (NO EMAILS / NO ORDERS)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aqua-password-recovery-source-qa.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Install frozen dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Compile Astro password recovery and login components
        working-directory: source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          const require=createRequire(import.meta.url);
          const {transform}=await import(require.resolve('@astrojs/compiler',{paths:[require.resolve('astro/package.json')]}));
          const files=[
            'src/astro/pages/LostPassPage.astro',
            'src/astro/pages/ResetPassPage.astro',
            'src/astroutils/CheckoutPage/LoginForm.astro',
            'src/astroutils/CheckoutPage/LoginFormSSG.astro'
          ];
          for(const file of files){const source=fs.readFileSync(file,'utf8');const result=await transform(source,{filename:file});assert(result.code);console.log('RECOVERY_ASTRO_COMPILE_PASS='+file);}
          const [lost,reset,login,loginSSG]=files.map(f=>fs.readFileSync(f,'utf8'));
          assert(lost.includes('id="lost-password-form"') && lost.includes('/api/user/lostpass'));
          assert(reset.includes('id="reset-password-form"') && reset.includes('/api/user/resetpass') && reset.includes('history.replaceState'));
          assert(!lost.includes('${data.msg}') && !reset.includes('notice.innerHTML'),'API error messages must not render raw HTML');
          assert(loginSSG.includes('a.key === "lostpass"') && !loginSSG.includes('target="_blank"'),'History login must link to WordPress authored reset request Page in same tab');
          assert(login.includes('a.key == "lostpass"') && !login.includes('target="_blank"'),'Checkout login must share reset flow');
          const pageRoute=fs.readFileSync('src/pages/[...slug].astro','utf8');
          assert(pageRoute.includes('page.key.startsWith("ssr-")'),'Password pages must be included in WordPress SSG route generation');
          console.log('AQUA_PASSWORD_RECOVERY_SOURCE_CONTRACT_PASS');
          NODE
      - name: Existing signed-session and buyer-login tests
        working-directory: source
        run: pnpm exec vitest run src/lib/utils/signedSession.test.ts src/lib/utils/orderHistoryApi.test.ts src/lib/utils/linkWooOrderCustomer.test.ts
      - name: Record source SHA
        working-directory: source
        run: git rev-parse HEAD
