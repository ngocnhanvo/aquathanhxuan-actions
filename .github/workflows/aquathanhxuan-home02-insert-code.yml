name: Aqua Home 02 homepage Insert Code
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-home02-insert-code.yml'
      - 'scripts/aquathanhxuan-home02-insert-code.cjs'
permissions:
  contents: read
jobs:
  insert-code:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aquathanhxuan-home02-insert-code.cjs

