name: Aqua Thanh Xuân Hero responsive QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-home-hero-responsive-qa.yml'

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - name: Install Playwright wrapper
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0

      - name: Verify responsive homepage Hero
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/aqua-home-hero
          node <<'NODE'
          const { chromium } = require('playwright');

          const origin = 'https://aquathanhxuan.io.vn';
          const cases = [
            { name: 'desktop-1440', width: 1440, height: 900 },
            { name: 'tablet-landscape-1024', width: 1024, height: 768 },
            { name: 'tablet-portrait-768', width: 768, height: 1024 },
            { name: 'phone-landscape-844', width: 844, height: 390 },
            { name: 'phone-portrait-390', width: 390, height: 844 },
          ];

          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          (async () => {
            const browser = await chromium.launch();
            try {
              for (const item of cases) {
                const page = await browser.newPage({ viewport: { width: item.width, height: item.height } });
                await page.goto(origin + '/?hero_qa=' + Date.now(), {
                  waitUntil: 'domcontentloaded',
                  timeout: 45000,
                });

                const hero = page.locator('[data-aqua-home-hero]');
                await hero.waitFor({ state: 'visible', timeout: 20000 });

                const overflow = await page.evaluate(() => ({
                  scrollWidth: document.documentElement.scrollWidth,
                  innerWidth: window.innerWidth,
                }));
                assert(
                  overflow.scrollWidth <= overflow.innerWidth + 1,
                  `QA_FAILED viewport=${item.name} horizontal_overflow scrollWidth=${overflow.scrollWidth} innerWidth=${overflow.innerWidth}`,
                );

                const heroBox = await hero.boundingBox();
                assert(heroBox && heroBox.height >= 280 && heroBox.height <= 570,
                  `QA_FAILED viewport=${item.name} hero_height actual=${heroBox?.height}`);

                const slides = hero.locator('[data-hero-slide]');
                assert(await slides.count() === 2, `QA_FAILED viewport=${item.name} slide_count`);

                const activeCount = await hero.locator('[data-hero-slide][data-active="true"]').count();
                assert(activeCount === 1, `QA_FAILED viewport=${item.name} active_slide_count actual=${activeCount}`);

                const images = hero.locator('[data-hero-slide] img');
                assert(await images.count() === 2, `QA_FAILED viewport=${item.name} image_count`);
                for (let i = 0; i < 2; i += 1) {
                  await images.nth(i).waitFor({ state: 'attached' });
                  const info = await images.nth(i).evaluate((img) => ({
                    src: img.getAttribute('src') || '',
                    alt: img.alt,
                  }));
                  assert(!/aquathanhxuan\.com\//i.test(info.src),
                    `QA_FAILED viewport=${item.name} legacy_hotlink src=${info.src}`);
                  assert(Boolean(info.alt.trim()), `QA_FAILED viewport=${item.name} image_${i}_alt_empty`);
                }
                const firstLoaded = await images.nth(0).evaluate((img) => img.naturalWidth > 0 && img.naturalHeight > 0);
                assert(firstLoaded, `QA_FAILED viewport=${item.name} active_image_not_loaded`);

                const text = (await hero.textContent()) || '';
                assert(text.includes('AQua Thanh Xuân'), `QA_FAILED viewport=${item.name} eyebrow_missing`);
                assert(text.includes('Đáp ứng mọi nhu cầu cho bể cá của bạn'), `QA_FAILED viewport=${item.name} headline_missing`);
                assert(await hero.locator('a[href="/san-pham"]').count() >= 1,
                  `QA_FAILED viewport=${item.name} product_cta_missing`);
                assert(await hero.locator('.aqua-hero__trust li').count() === 6,
                  `QA_FAILED viewport=${item.name} trust_dom_count`);

                const dots = hero.locator('[data-hero-dot]');
                assert(await dots.count() === 2, `QA_FAILED viewport=${item.name} dot_count`);
                await dots.nth(1).click();
                await page.waitForFunction(() => {
                  const active = document.querySelector('[data-aqua-home-hero] [data-hero-slide][data-active="true"]');
                  return active && active.querySelector('h2')?.textContent?.includes('Sản phẩm chính hãng');
                }, null, { timeout: 5000 });

                const currentText = await hero.locator('[data-hero-slide][data-active="true"] h2').textContent();
                assert(currentText?.includes('Sản phẩm chính hãng'),
                  `QA_FAILED viewport=${item.name} carousel_next_failed current=${currentText}`);
                await page.waitForFunction(() => {
                  const image = document.querySelectorAll('[data-aqua-home-hero] [data-hero-slide] img')[1];
                  return image instanceof HTMLImageElement && image.naturalWidth > 0 && image.naturalHeight > 0;
                }, null, { timeout: 10000 });

                await page.screenshot({
                  path: `artifacts/aqua-home-hero/${item.name}.png`,
                  fullPage: false,
                });
                console.log(`HERO_VIEWPORT_PASS name=${item.name} size=${item.width}x${item.height} height=${heroBox.height}`);
                await page.close();
              }
              console.log('RESPONSIVE_HERO_QA=PASS');
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error?.stack || error);
            process.exit(1);
          });
          NODE

      - name: Upload responsive Hero screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquathanhxuan-home-hero-responsive-qa
          path: artifacts/aqua-home-hero
          if-no-files-found: ignore
          retention-days: 7
