name: Aqua homepage next-section read-only inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-homepage-next-inventory.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - name: Inspect real homepage ESC Table sources without modifying CMS
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          from urllib.parse import urlparse
          env = {}
          for line in os.environ.get('ENV_FILE', '').splitlines():
              m = re.match(r'^\s*(?:export\s+)?([\w]+)\s*=\s*(.*)$', line)
              if m:
                  env[m.group(1)] = m.group(2).strip().strip('"\'')
          wp = env.get('WC_URL','').rstrip('/')
          if wp != 'https://admin.aquathanhxuan.io.vn':
              raise SystemExit('BLOCKED: unexpected WordPress origin')
          def get(path):
              req = urllib.request.Request(wp + path, headers={'Accept':'application/json','User-Agent':'AquaHomepageInventory/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=25) as res:
                      return json.loads(res.read())
              except urllib.error.HTTPError as e:
                  print('FETCH_STATUS', path, e.code)
                  return None
          page = get('/wp-json/wp/v2/pages/82454?_fields=id,slug,status,content,acf')
          if isinstance(page,dict):
              raw = (page.get('content') or {}).get('rendered','')
              print('PAGE_STATUS', page.get('id'), page.get('slug'), page.get('status'))
              print('PAGE_SHORTCODES', sorted(set(re.findall(r'\[table[^\]]*id\s*=\s*["\']?([A-Za-z0-9_\-]+)', raw, re.I))))
              print('PAGE_HAS_HOME_02', 'home_02' in raw.lower())
          else:
              print('PAGE_PUBLIC_REST_UNAVAILABLE')
          for endpoint in ['/wp-json/tablepress/v1/tables', '/wp-json/tablepress/v1/tables/home_02', '/wp-json/tablepress/v1/tables/home_03', '/wp-json/tablepress/v1/tables/home_04']:
              data = get(endpoint)
              if isinstance(data,dict):
                  rows = data.get('data') if isinstance(data.get('data'),list) else data.get('items')
                  print('TABLE', endpoint, 'fields=', sorted(data.keys()), 'rows=', len(rows) if isinstance(rows,list) else '?')
                  if isinstance(rows,list) and rows:
                      first=rows[0]
                      print('TABLE_COLUMNS', endpoint, list(first.keys()) if isinstance(first,dict) else 'array-row')
              elif isinstance(data,list):
                  print('TABLE', endpoint, 'count=',len(data), 'preview_types=',[type(x).__name__ for x in data[:2]])
              else:
                  print('TABLE_UNAVAILABLE',endpoint)
          PY

      - name: Discover genuine filter and lighting product/category media for Home 04
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, json, urllib.request, urllib.parse, urllib.error
          config = {}
          for line in os.environ.get('ENV_FILE','').splitlines():
              key, separator, value = line.partition('=')
              key = key.strip().removeprefix('export ').strip()
              if separator and key == 'WC_URL':
                  config[key] = value.strip().strip(chr(34)).strip(chr(39))
          base=config.get('WC_URL','').rstrip('/')
          assert base=='https://admin.aquathanhxuan.io.vn', 'Invalid CMS origin'
          def read(path):
              url=base+path
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'AquaHome04ReadOnly/1.0','Accept':'application/json'}),timeout=25) as response:
                      return json.load(response)
              except Exception as error:
                  print('HOME04_FETCH_ERROR',path,type(error).__name__)
                  return None
          categories=read('/wp-json/wc/store/v1/products/categories?per_page=100')
          if isinstance(categories,list):
              matches=[{'id':c.get('id'),'name':c.get('name'),'slug':c.get('slug'),'parent':c.get('parent'),'count':c.get('count'),'image':c.get('image',{}).get('src') if isinstance(c.get('image'),dict) else None} for c in categories if any(x in str(c.get('name','')).lower()+' '+str(c.get('slug','')).lower() for x in ['lọc','loc','filter','đèn','den','light'])]
              print('HOME04_CATEGORY_CANDIDATES='+json.dumps(matches[:30],ensure_ascii=False))
          for term in ['lọc','đèn','filter','led']:
              products=read('/wp-json/wc/store/v1/products?per_page=40&search='+urllib.parse.quote(term))
              if isinstance(products,list):
                  selected=[{'id':p.get('id'),'name':p.get('name'),'slug':p.get('slug'),'permalink':urllib.parse.urlparse(str(p.get('permalink',''))).path,'images':[{'id':im.get('id'),'src':urllib.parse.urlparse(str(im.get('src',''))).path,'alt':im.get('alt')} for im in p.get('images',[])[:2]],'categories':p.get('categories')} for p in products[:8]]
                  print('HOME04_PRODUCTS_'+term+'='+json.dumps(selected,ensure_ascii=False))
          for term in ['lọc','đèn','LED']:
              media=read('/wp-json/wp/v2/media?per_page=30&search='+urllib.parse.quote(term)+'&_fields=id,slug,title,alt_text,source_url')
              if isinstance(media,list):
                  print('HOME04_MEDIA_'+term+'='+json.dumps([{'id':m.get('id'),'title':m.get('title',{}).get('rendered'),'path':urllib.parse.urlparse(str(m.get('source_url',''))).path,'alt':m.get('alt_text')} for m in media[:10]],ensure_ascii=False))
          PY
