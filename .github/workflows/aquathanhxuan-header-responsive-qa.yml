name: Aqua Thanh Xuân Header responsive QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-header-responsive-qa.yml'

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - name: Install Playwright wrapper
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify responsive Header
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/aqua-header-responsive
          node <<'NODE'
          const { chromium } = require('playwright');

          const origin = 'https://aquathanhxuan.io.vn';
          const expectedTopLevel = 11;
          const cases = [
            { name: 'desktop-1440', width: 1440, height: 900, desktop: true },
            { name: 'tablet-landscape-1024', width: 1024, height: 768, desktop: true },
            { name: 'tablet-portrait-768', width: 768, height: 1024, desktop: false },
            { name: 'phone-landscape-844', width: 844, height: 390, desktop: false },
            { name: 'phone-portrait-390', width: 390, height: 844, desktop: false },
          ];

          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          const overlaps = (a, b) => {
            if (!a || !b) return false;
            return !(
              a.x + a.width <= b.x ||
              b.x + b.width <= a.x ||
              a.y + a.height <= b.y ||
              b.y + b.height <= a.y
            );
          };

          (async () => {
            const browser = await chromium.launch();
            try {
              for (const item of cases) {
                const page = await browser.newPage({
                  viewport: { width: item.width, height: item.height },
                });
                await page.goto(origin + '/?header_qa=' + Date.now(), {
                  waitUntil: 'domcontentloaded',
                  timeout: 45000,
                });
                await page.locator('#main-header').waitFor({ state: 'visible', timeout: 15000 });

                const overflow = await page.evaluate(() => ({
                  scrollWidth: document.documentElement.scrollWidth,
                  innerWidth: window.innerWidth,
                }));
                assert(
                  overflow.scrollWidth <= overflow.innerWidth + 1,
                  `QA_FAILED viewport=${item.name} horizontal_overflow scrollWidth=${overflow.scrollWidth} innerWidth=${overflow.innerWidth}`,
                );

                if (item.desktop) {
                  assert(await page.locator('#header-product-search').isVisible(), `QA_FAILED viewport=${item.name} desktop_search_hidden`);
                  assert(await page.locator('#header-navrow').isVisible(), `QA_FAILED viewport=${item.name} desktop_nav_hidden`);
                  assert(!(await page.locator('#hamburger-btn').isVisible()), `QA_FAILED viewport=${item.name} hamburger_visible_on_desktop`);
                  const count = await page.locator('#desktop-menu > ul > li').count();
                  assert(count === expectedTopLevel, `QA_FAILED viewport=${item.name} desktop_menu_count expected=${expectedTopLevel} actual=${count}`);
                  const bg = await page.locator('#header-navrow').evaluate((el) => getComputedStyle(el).backgroundColor);
                  assert(bg === 'rgb(51, 43, 142)', `QA_FAILED viewport=${item.name} nav_background actual=${bg}`);
                } else {
                  const hamburger = page.locator('#hamburger-btn');
                  const search = page.locator('#mobile-search-btn');
                  const account = page.locator('#header-brandbar a[aria-label="Tài khoản"]');
                  const cart = page.locator('#header-brandbar .mobile-cart-icon .js-cart-navigation');
                  const logo = page.locator('#header-brandbar a[aria-label="Về trang chủ"]').first();

                  assert(await hamburger.isVisible(), `QA_FAILED viewport=${item.name} hamburger_hidden`);
                  assert(await search.isVisible(), `QA_FAILED viewport=${item.name} mobile_search_hidden`);
                  assert(await account.isVisible(), `QA_FAILED viewport=${item.name} mobile_account_hidden`);
                  assert(await cart.isVisible(), `QA_FAILED viewport=${item.name} mobile_cart_hidden`);
                  assert(!(await page.locator('#header-navrow').isVisible()), `QA_FAILED viewport=${item.name} desktop_nav_visible`);
                  assert(!(await page.locator('#header-brandbar a[href^="tel:"]').isVisible().catch(() => false)), `QA_FAILED viewport=${item.name} mobile_hotline_visible`);

                  const [hb, lb, sb, ab, cb] = await Promise.all([
                    hamburger.boundingBox(),
                    logo.boundingBox(),
                    search.boundingBox(),
                    account.boundingBox(),
                    cart.boundingBox(),
                  ]);
                  assert(hb && lb && sb && ab && cb, `QA_FAILED viewport=${item.name} missing_header_geometry`);
                  const logoCenter = lb.x + lb.width / 2;
                  assert(Math.abs(logoCenter - item.width / 2) <= 6, `QA_FAILED viewport=${item.name} logo_not_centered center=${logoCenter}`);
                  assert(hb.x < lb.x, `QA_FAILED viewport=${item.name} hamburger_not_left`);
                  assert(sb.x > logoCenter && ab.x > logoCenter && cb.x > logoCenter, `QA_FAILED viewport=${item.name} actions_not_right`);
                  assert(!overlaps(lb, sb) && !overlaps(lb, ab) && !overlaps(lb, cb), `QA_FAILED viewport=${item.name} logo_actions_overlap`);

                  await hamburger.click();
                  const drawer = page.locator('#mobile-menu-container');
                  await drawer.waitFor({ state: 'visible', timeout: 5000 });
                  assert(await drawer.getAttribute('aria-hidden') === 'false', `QA_FAILED viewport=${item.name} drawer_aria_hidden`);
                  assert(await page.locator('#mobile-menu-overlay').isVisible(), `QA_FAILED viewport=${item.name} drawer_overlay_hidden`);
                  const drawerBg = await drawer.evaluate((el) => getComputedStyle(el).backgroundColor);
                  assert(drawerBg === 'rgb(51, 43, 142)', `QA_FAILED viewport=${item.name} drawer_background actual=${drawerBg}`);
                  const topCount = await drawer.locator('nav > ul > li').count();
                  assert(topCount === expectedTopLevel, `QA_FAILED viewport=${item.name} mobile_menu_count expected=${expectedTopLevel} actual=${topCount}`);
                  const bodyOverflow = await page.evaluate(() => getComputedStyle(document.body).overflow);
                  assert(bodyOverflow === 'hidden', `QA_FAILED viewport=${item.name} body_not_locked overflow=${bodyOverflow}`);

                  const firstToggle = drawer.locator('[data-menu-toggle]').first();
                  if (await firstToggle.count()) {
                    const panelId = await firstToggle.getAttribute('aria-controls');
                    await firstToggle.click();
                    assert(await firstToggle.getAttribute('aria-expanded') === 'true', `QA_FAILED viewport=${item.name} submenu_not_expanded`);
                    if (panelId) {
                      assert(await page.locator('#' + panelId).isVisible(), `QA_FAILED viewport=${item.name} submenu_panel_hidden`);
                    }
                  }

                  await page.keyboard.press('Escape');
                  assert(await drawer.getAttribute('aria-hidden') === 'true', `QA_FAILED viewport=${item.name} drawer_escape_failed`);
                  assert(await page.evaluate(() => document.activeElement?.id) === 'hamburger-btn', `QA_FAILED viewport=${item.name} drawer_focus_not_restored`);

                  await search.click();
                  const searchPanel = page.locator('#mobile-search-panel');
                  assert(await searchPanel.isVisible(), `QA_FAILED viewport=${item.name} search_panel_hidden`);
                  assert(await searchPanel.getAttribute('aria-hidden') === 'false', `QA_FAILED viewport=${item.name} search_panel_aria_hidden`);
                  assert(await page.evaluate(() => document.activeElement?.id) === 'mobile-product-search', `QA_FAILED viewport=${item.name} search_input_not_focused`);
                  await page.keyboard.press('Escape');
                  assert(await searchPanel.getAttribute('aria-hidden') === 'true', `QA_FAILED viewport=${item.name} search_escape_failed`);
                  assert(await page.evaluate(() => document.activeElement?.id) === 'mobile-search-btn', `QA_FAILED viewport=${item.name} search_focus_not_restored`);
                }

                await page.screenshot({
                  path: `artifacts/aqua-header-responsive/${item.name}.png`,
                  fullPage: false,
                });
                console.log(`VIEWPORT_PASS name=${item.name} size=${item.width}x${item.height}`);
                await page.close();
              }
              console.log('RESPONSIVE_HEADER_QA=PASS');
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error?.stack || error);
            process.exit(1);
          });
          NODE
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquathanhxuan-header-responsive-qa
          path: artifacts/aqua-header-responsive
          if-no-files-found: ignore
          retention-days: 7
