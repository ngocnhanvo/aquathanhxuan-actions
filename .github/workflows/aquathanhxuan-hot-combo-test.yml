name: Aqua Hot Combo source contract tests
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-hot-combo-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm exec vitest run src/lib/wordpress/tablepress/home03.test.ts
        working-directory: source
      - name: Check Hot Combo Astro diagnostics (keep unrelated baseline visible)
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          pnpm exec astro check 2>&1 | tee /tmp/aqua-hot-combo-astro-check.log || true
          python3 - <<'PY'
          import re
          log=open('/tmp/aqua-hot-combo-astro-check.log',encoding='utf8').read()
          # Each error starts with a path heading; scope this gate strictly to Home_03.
          headings=re.findall(r'src/astro/tablepress/Home_03\\.astro[^\\n]*',log)
          broken=[h for h in headings if 'error' in h]
          if broken:
              print('HOT_COMBO_ASTRO_TYPE_FAIL='+str(broken))
              raise SystemExit(1)
          print('HOT_COMBO_ASTRO_TYPE_PASS; unrelated repository diagnostics above remain tracked')
          PY
