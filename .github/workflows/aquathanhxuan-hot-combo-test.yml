name: Aqua Hot Combo source contract tests
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-hot-combo-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-astro
          ref: master
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm exec vitest run src/lib/wordpress/tablepress/home03.test.ts
        working-directory: source
      - run: pnpm exec astro check
        working-directory: source
