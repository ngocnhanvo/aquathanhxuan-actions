name: Aqua equipment catalog read-only inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-equipment-catalog-inventory.yml'
      - 'scripts/aquathanhxuan-equipment-catalog-inventory.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/aquathanhxuan-equipment-catalog-inventory.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aquathanhxuan-equipment-catalog-inventory.cjs
