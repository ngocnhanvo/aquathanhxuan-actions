name: Aqua production Home 00 mobile portrait banner QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-home00-mobile-production-qa.yml'
      - 'qa-requests/home00-mobile-20261109.json'
permissions:
  contents: read
jobs:
  read-only-qa:
    if: github.repository == 'ngocnhanvo/aquathanhxuan-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check scripts/aquathanhxuan-home00-mobile-production-qa.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aquathanhxuan-home00-mobile-production-qa.cjs
      - name: Upload six viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-home00-mobile-production-qa
          path: artifacts/home00-mobile-production/
          if-no-files-found: ignore
          retention-days: 7
