name: Aqua consultation contact Info CMS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-consultation-info.yml'
      - 'scripts/aquathanhxuan-consultation-info.cjs'
permissions:
  contents: read
concurrency:
  group: aqua-consultation-info
  cancel-in-progress: false
jobs:
  update-empty-fields:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/aquathanhxuan-consultation-info.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aquathanhxuan-consultation-info.cjs
