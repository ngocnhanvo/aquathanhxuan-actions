name: Aqua cart checkout receipt native ESC Tables (CMS only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aqua-commerce-business-esc-install.yml'
      - 'scripts/aqua-commerce-business-esc-install.cjs'
permissions:
  contents: read
concurrency:
  group: aqua-commerce-business-cms-pages
  cancel-in-progress: false
jobs:
  native-tables:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check scripts/aqua-commerce-business-esc-install.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Add native ESC Tables to existing WordPress Cart/Checkout/Receipt Pages
        run: node scripts/aqua-commerce-business-esc-install.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-commerce-business-native-esc
          path: artifacts/aqua-commerce-esc/
          if-no-files-found: ignore
          retention-days: 14
