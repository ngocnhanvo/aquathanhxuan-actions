name: Aqua password recovery routes read-only audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/aqua-password-recovery-readonly-audit.cjs'
      - '.github/workflows/aqua-password-recovery-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/aqua-password-recovery-readonly-audit.cjs
      - name: Inspect public pages, REST routes and frontend paths without changing state
        run: node scripts/aqua-password-recovery-readonly-audit.cjs
