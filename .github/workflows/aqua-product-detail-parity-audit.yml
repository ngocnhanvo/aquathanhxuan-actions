name: Aqua product detail source-target content audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aqua-product-detail-parity-audit.yml'
      - 'audit-requests/product-detail-parity.json'
permissions:
  contents: write
jobs:
  detail-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/aqua-product-detail-parity-audit.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aqua-product-detail-parity-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aqua-product-detail-parity
          path: artifacts/product-detail-parity
          if-no-files-found: ignore
          retention-days: 14
      - name: Save compact source-target differences for follow-up work
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const file='artifacts/product-detail-parity/report.json';
            if (!fs.existsSync(file)) {
              core.warning('Audit report is absent; no state to persist');
              return;
            }
            const audit=JSON.parse(fs.readFileSync(file,'utf8'));
            const report={
              runId:context.runId, commit:context.sha,
              startedAt:audit.startedAt, status:audit.status,scope:audit.scope,
              distinctProducts:audit.distinctProducts,
              mismatchedProducts:audit.mismatchedProducts,
              comparisons:audit.comparisons,categories:audit.categories,
              differences:(audit.items||[]).filter(x=>x.flags?.length).map(x=>({slug:x.slug,sourceId:x.sourceId,targetId:x.targetId,flags:x.flags})),
              samples:(audit.samples||[]).map(x=>({
                slug:x.slug,sourceUrl:x.sourceUrl,targetUrl:x.targetUrl,
                sourceHttp:x.sourceHttp,targetHttp:x.targetHttp,
                source:x.source,target:x.target,
                sourceError:x.sourceError,targetError:x.targetError
              })),
              errors:audit.errors,
            };
            const path='chatgpt/product-detail-parity-report.json';
            const existing=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:context.ref.replace('refs/heads/','')})
              .catch(e=>e.status===404?null:Promise.reject(e));
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,
              branch:context.ref.replace('refs/heads/',''),
              message:'Lưu chênh lệch nội dung chi tiết sản phẩm',
              content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64'),
              ...(existing?.data?.sha?{sha:existing.data.sha}:{})
            });
