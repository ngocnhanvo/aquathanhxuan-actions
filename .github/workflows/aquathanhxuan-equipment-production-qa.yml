name: Aqua equipment nested Product production QA
on:
  push:
    branches: [main]
    paths:
      - 'qa-requests/equipment-production.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    if: github.repository == 'ngocnhanvo/aquathanhxuan-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/aquathanhxuan-equipment-production-qa.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aquathanhxuan-equipment-production-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aquathanhxuan-equipment-production-qa
          path: qa-artifacts/equipment
          if-no-files-found: ignore
