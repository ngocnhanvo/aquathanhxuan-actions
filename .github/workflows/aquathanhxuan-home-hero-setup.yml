name: Aqua homepage Hero CMS setup one-shot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-home-hero-setup.yml'
      - 'scripts/aquathanhxuan-home-hero-setup.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_URL: https://admin.aquathanhxuan.io.vn
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install matching Playwright driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Set up real WordPress homepage Hero
        run: node scripts/aquathanhxuan-home-hero-setup.mjs
      - name: Upload CMS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquathanhxuan-home-hero-cms
          path: artifacts/home-hero
          if-no-files-found: ignore
