name: Aqua support Pages and native ESC Tables
on:
  push:
    branches: [main]
    paths:
      - 'scripts/aquathanhxuan-support-pages-create.cjs'
      - '.github/workflows/aquathanhxuan-support-pages-create.yml'
permissions:
  contents: read
concurrency:
  group: aqua-support-pages-cms-writer
  cancel-in-progress: false
jobs:
  create-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/aquathanhxuan-support-pages-create.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aquathanhxuan-support-pages-create.cjs
