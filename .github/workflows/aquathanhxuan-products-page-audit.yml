name: Aqua inspect existing Product listing Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-products-page-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Read WordPress Page identities and native ACF choices
        id: audit
        run: node scripts/aquathanhxuan-products-page-audit.cjs
      - name: Save verified Page inventory
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const path='chatgpt/home02products-page-inventory.json';
            const report=fs.existsSync(path)?JSON.parse(fs.readFileSync(path,'utf8')):{error:'Inventory report missing'};
            report.run_id=context.runId;report.outcome='${{ steps.audit.outcome }}';
            const ref=context.ref.replace('refs/heads/','');
            const existing=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref})
              .catch(e=>e.status===404?null:Promise.reject(e));
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,branch:ref,
              message:'Record real Product listing Page inventory',
              content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64'),
              ...(existing?.data?.sha?{sha:existing.data.sha}:{})
            });
