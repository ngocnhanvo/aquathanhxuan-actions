name: Aqua MF5 coupon note production QA (NO ORDERS)
on:
  push:
    branches: [main]
    paths:
      - 'qa-requests/aqua-mf5-cart-note.json'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check scripts/aqua-mf5-cart-note-qa.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify MF5 native note in cart desktop/mobile and clean disposable cart
        run: node scripts/aqua-mf5-cart-note-qa.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-mf5-cart-note-qa
          path: artifacts/aqua-mf5-cart-note
          retention-days: 14
          if-no-files-found: ignore
