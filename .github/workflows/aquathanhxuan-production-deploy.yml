name: Aqua Thanh Xuân Astro deployment (WordPress Build Website only)
on:
  repository_dispatch:
    types: [wp_trigger_build]
permissions:
  contents: read
concurrency:
  group: aquathanhxuan-astro-production-deploy
  cancel-in-progress: false
jobs:
  astro:
    if: >-
      github.repository == 'ngocnhanvo/aquathanhxuan-actions'
      && github.ref == 'refs/heads/main'
      && github.event_name == 'repository_dispatch'
      && github.event.action == 'wp_trigger_build'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      ZIP_PATH: source/upload/aquathanhxuan-astro.zip
      AQUATHANHXUAN_PRODUCTION_SOURCE: master
      AQUATHANHXUAN_DEPLOY_SOURCE_BRANCH: master
      AQUATHANHXUAN_DEPLOY_REQUEST_DOMAIN: ${{ github.event.client_payload.site_domain }}
      AQUATHANHXUAN_CANONICAL_WP_ORIGIN: https://admin.aquathanhxuan.io.vn
      AQUATHANHXUAN_CANONICAL_CLIENT_ORIGIN: https://aquathanhxuan.io.vn
    steps:
      - name: Checkout immutable AQUATHANHXUAN deploy scripts
        uses: actions/checkout@v4
        with:
          path: actions-hub
      - name: Checkout only Astro PRODUCTION branch
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
      - name: Verify AQUATHANHXUAN production source and configured WordPress/frontend destinations
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ENV_FILE" && test -n "$SOURCE_REPO_PAT"
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          test "$(git -C source symbolic-ref --short HEAD)" = master
          sha="$(git -C source rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "AQUATHANHXUAN_DEPLOY_COMMIT=$sha" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          vals={}
          for line in os.environ['ENV_FILE'].splitlines():
              m=re.match(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)\s*$',line)
              if m:vals[m[1]]=m[2].strip().strip('"\'')
          def canonical_origin(key):
              url=urlsplit(os.environ.get(key,''))
              if (url.scheme!='https' or not url.hostname or url.username or url.password
                  or url.port not in (None,443) or url.path not in ('','/')
                  or url.query or url.fragment):
                  raise RuntimeError('Invalid canonical HTTPS origin: '+key)
              return url.hostname, 'https://'+url.hostname
          wp_host,wp_origin=canonical_origin('AQUATHANHXUAN_CANONICAL_WP_ORIGIN')
          client_host,client_origin=canonical_origin('AQUATHANHXUAN_CANONICAL_CLIENT_ORIGIN')
          if wp_host!='admin.aquathanhxuan.io.vn' or client_host!='aquathanhxuan.io.vn':
              raise RuntimeError('Aqua canonical origins changed unexpectedly')
          target='/domains/'+client_host+'/public_html/'
          if os.environ.get('AQUATHANHXUAN_DEPLOY_REQUEST_DOMAIN')!=client_host:
              raise RuntimeError('Build trigger domain disagrees with Aqua canonical frontend')
          if any(x in vals for x in ('NCKH_GOOGLE_OAUTH_JSON','NCKH_SESSION_KEY',
                                     'AQUATHANHXUAN_GOOGLE_OAUTH_JSON','AQUATHANHXUAN_SESSION_KEY',
                                     'GOOGLE_OAUTH_STAGING_JSON')):
              raise RuntimeError('Private runtime credentials cannot be written into build .env')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as out:
              out.write('AQUATHANHXUAN_CLIENT_HOST='+client_host+'\n')
              out.write('AQUATHANHXUAN_CLIENT_ORIGIN='+client_origin+'\n')
              out.write('AQUATHANHXUAN_WP_ORIGIN='+wp_origin+'\n')
              out.write('ASTRO_FTP_TARGET='+target+'\n')
              out.write('FTP_ASTRO_DIR='+target+'\n')
          print('PASS: AQUATHANHXUAN master pinned to canonical WordPress/frontend origins')
          PY
      - name: Refuse application-specific private runtime in reusable Aqua Thanh Xuân
        shell: bash
        run: |
          set -euo pipefail
          test ! -d source/src/lib/nckh
          test ! -d source/src/pages/api/nckh
          test ! -d source/src/pages/api/auth/google
      - name: Check signed unzip staging destination before any build or FTP
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile actions-hub/scripts/aquathanhxuan-remote-unzip.py
          python3 actions-hub/scripts/aquathanhxuan-remote-unzip.py verify
      - name: Read signed reusable-asset inventory (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          set +x
          # Sitemap is generated from WordPress source during the Astro build.
          # Never read the currently deployed sitemap or its revision here.
          python3 actions-hub/scripts/aquathanhxuan-remote-unzip.py manifest
      # GitHub-hosted runners are ephemeral: reuse downloaded packages
      # keyed by the Astro production lockfile. Never cache node_modules or .env.
      - name: Set up pnpm 9 (without installing project dependencies)
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js 24 with pnpm store cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      # Same production data cache model as Blue Sea: retain Astro's
      # native .cache across fresh runners. No special Page/section filtering.
      - name: Restore and update Astro cache
        uses: actions/cache@v4
        with:
          path: source/.cache
          key: aquathanhxuan-prod-dot-cache-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            aquathanhxuan-prod-dot-cache-v2-${{ runner.os }}-
      # A separate GitHub Actions step for each potentially blocking process.
      # Python stdlib FTPS needs no APT packages or lftp background installer.
      - name: Install locked Astro dependencies
        timeout-minutes: 12
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          echo "AQUA_BUILD_STAGE=DEPENDENCIES_START $(date -u +%FT%TZ)"
          timeout --signal=TERM --kill-after=15s 660s pnpm install --frozen-lockfile --prefer-offline
          echo "AQUA_BUILD_STAGE=DEPENDENCIES_EXIT $(date -u +%FT%TZ)"
      - name: Prepare canonical WordPress build environment
        timeout-minutes: 3
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          kept=[]
          for line in os.environ['ENV_FILE'].splitlines():
              m=re.match(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=',line)
              if m and m.group(1) in ('WC_URL','WC_URL_CLIENT'):
                  continue
              kept.append(line)
          kept.append('WC_URL='+os.environ['AQUATHANHXUAN_CANONICAL_WP_ORIGIN'])
          kept.append('WC_URL_CLIENT='+os.environ['AQUATHANHXUAN_CANONICAL_CLIENT_ORIGIN'])
          with open('.env','w',encoding='utf8') as out:
              out.write('\n'.join(kept).rstrip()+'\n')
          PY
          echo "AQUA_BUILD_STAGE=CANONICAL_ENV_READY $(date -u +%FT%TZ)"
      - name: Build Astro Production (incremental WordPress data cache)
        timeout-minutes: 22
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          echo "AQUA_BUILD_STAGE=ASTRO_START $(date -u +%FT%TZ)"
          # An open Node handle can remain after Astro prints Complete!.
          timeout --signal=TERM --kill-after=15s 1200s pnpm run build-git
          echo "AQUA_BUILD_STAGE=ASTRO_PROCESS_EXIT $(date -u +%FT%TZ)"
      - name: Validate compiled Astro dist output
        timeout-minutes: 3
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          node --check dist/server/entry.mjs
          test -s dist/client/index.html
          test -s dist/server/entry.mjs
          echo "AQUA_BUILD_STAGE=DIST_CHECKS_PASS $(date -u +%FT%TZ)"
          echo "Build source SHA: $(git rev-parse HEAD) (master)" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate built-in Python FTPS upload client
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile actions-hub/scripts/aquathanhxuan-resumable-ftps.py
          echo "AQUA_BUILD_STAGE=PYTHON_FTPS_READY $(date -u +%FT%TZ)"
      - name: Prepare staging files and SEO metadata (strictly no .env)
        timeout-minutes: 6
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p deploy upload
          # All three root HTML entrypoints and representative _astro CSS/JS
          # and image assets have been tested by reversible FTPS removal.
          # Their public URLs continue to return identical content from
          # the Astro Node runtime client tree. Keep one canonical copy.
          # Reproducible staging probes: 39211910217, 39212152303,
          # 39212358489 (CSS/JS/WebP passed), 39212524243 (restored OK).
          cp -a dist/. deploy/
          test -s deploy/client/index.html
          test -s deploy/server/entry.mjs
          test ! -e deploy/index.html
          test ! -e deploy/_astro
          # Apache serves these public metadata files from document-root.
          # Astro has already converted WordPress source data to the frontend
          # origin during this build, so package the generated files every time.
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlsplit
          import xml.etree.ElementTree as ET

          root = Path("deploy")
          origin = os.environ['AQUATHANHXUAN_CLIENT_ORIGIN']
          published = {}
          for name in ("sitemap.xml", "robots.txt", "llms.txt"):
              compiled = root / "client" / name
              if not compiled.is_file():
                  raise RuntimeError("Missing Astro SEO output: " + name)
              raw = compiled.read_bytes()
              if not raw:
                  raise RuntimeError("Empty Astro SEO output: " + name)
              published[name] = raw

          try:
              xmlroot = ET.fromstring(published["sitemap.xml"])
          except ET.ParseError as e:
              raise RuntimeError("Invalid generated sitemap XML: " + str(e))
          ns = "{http://www.sitemaps.org/schemas/sitemap/0.9}"
          if xmlroot.tag != ns + "urlset":
              raise RuntimeError("Invalid sitemap namespace")
          urls = []
          for item in xmlroot.findall(ns + "url"):
              loc = item.find(ns + "loc")
              if loc is None or not loc.text:
                  raise RuntimeError("Missing sitemap loc")
              value = loc.text.strip()
              p = urlsplit(value)
              if p.scheme != "https" or p.netloc != os.environ['AQUATHANHXUAN_CLIENT_HOST'] or p.query or p.fragment:
                  raise RuntimeError("Sitemap loc uses unsafe origin")
              urls.append(value)
          if not urls or origin + "/" not in urls or len(urls) != len(set(urls)):
              raise RuntimeError("Sitemap homepage missing/duplicate")

          for name, data in published.items():
              (root / name).write_bytes(data)
          print("PASS: Astro SEO files generated from WordPress source and packaged for production")
          PY
          echo "$(date +%s)" > deploy/pm2-reload.txt
          python3 - <<'PY'
          import json,os
          sha=os.environ['AQUATHANHXUAN_DEPLOY_COMMIT']
          with open('deploy/aquathanhxuan-staging-build.json','w',encoding='utf8') as handle:
              json.dump({
                  'branch':'master','commit':sha,'target':os.environ['AQUATHANHXUAN_CLIENT_HOST'],
              },handle)
          PY
          # PHP uses the root copy for signed activation/rollback provenance.
          # Astro Node serves public static from client/, so publish the exact
          # same marker there for DEPLOY_READY verification.
          cp deploy/aquathanhxuan-staging-build.json deploy/client/aquathanhxuan-staging-build.json
          cmp -s deploy/aquathanhxuan-staging-build.json deploy/client/aquathanhxuan-staging-build.json
          test ! -e deploy/.env
          test -s deploy/server/entry.mjs
          test -s deploy/client/index.html
          echo "AQUA_BUILD_STAGE=PREPARE_STAGING_FILES_AND_SEO_METADATA_STRICTLY_NO_ENV__PASS $(date -u +%FT%TZ)"
      - name: Compute signed reusable image/static deltas
        timeout-minutes: 8
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          # Image and public static reuse only remove bytes from the ZIP
          # after a signed PHP inventory proves both hash and size unchanged.
          # server/ SSR, index.html and SEO files remain in every release.
          # PHP restores every reused byte into verified staging BEFORE swap.
          python3 ../actions-hub/scripts/aquathanhxuan-image-delta-package.py
          python3 ../actions-hub/scripts/aquathanhxuan-static-delta-package.py
          echo "AQUA_BUILD_STAGE=COMPUTE_SIGNED_REUSABLE_IMAGE_STATIC_DELTAS_PASS $(date -u +%FT%TZ)"
      - name: Create compiled staging ZIP
        timeout-minutes: 8
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          cd deploy
          zip -q -r ../upload/aquathanhxuan-astro.zip .
          cd ..
          echo "AQUA_BUILD_STAGE=CREATE_COMPILED_STAGING_ZIP_PASS $(date -u +%FT%TZ)"
      - name: Verify staging ZIP security and source provenance
        timeout-minutes: 3
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from zipfile import ZipFile
          with ZipFile('upload/aquathanhxuan-astro.zip') as z:
              names=z.namelist()
              if '.env' in names or any('private-runtime' in name for name in names):
                  raise RuntimeError('Refusing archive with private runtime secrets')
              # No flattened client output must reappear at root.
              if any(name in names for name in ('index.html','_astro/')):
                  raise RuntimeError('Duplicate application assets outside client/ are forbidden')
              for static in ('sitemap.xml','robots.txt','llms.txt'):
                  if static not in names or ('client/' + static) not in names:
                      raise RuntimeError('Missing generated SEO file: ' + static)
                  if z.read(static) != z.read('client/' + static):
                      raise RuntimeError('SEO root/client copies differ: ' + static)
              if 'aquathanhxuan-image-delta.json' in names:
                  image_delta=json.loads(z.read('aquathanhxuan-image-delta.json'))
                  if image_delta.get('format') != 1 or not isinstance(image_delta.get('reuse'),list) or not isinstance(image_delta.get('files'),dict):
                      raise RuntimeError('Malformed signed image delta ZIP manifest')
                  for name in image_delta['reuse']:
                      if not isinstance(name,str) or 'client/images/'+name in names or name not in image_delta['files']:
                          raise RuntimeError('Reused image was improperly uploaded')
              if 'aquathanhxuan-static-delta.json' in names:
                  static_delta=json.loads(z.read('aquathanhxuan-static-delta.json'))
                  if (static_delta.get('format')!=1 or
                      not isinstance(static_delta.get('reuse'),list) or
                      not isinstance(static_delta.get('files'),dict)):
                      raise RuntimeError('Malformed static delta ZIP marker')
                  for name in static_delta['reuse']:
                      if (not isinstance(name,str)
                          or name in ('index.html','aquathanhxuan-staging-build.json')
                          or 'client/'+name in names or name not in static_delta['files']):
                          raise RuntimeError('Reused static file was improperly uploaded')
              meta=json.loads(z.read('aquathanhxuan-staging-build.json'))
              if (meta.get('branch')!='master'
                  or meta.get('commit')!=os.environ['AQUATHANHXUAN_DEPLOY_COMMIT']
                  or meta.get('target')!=os.environ['AQUATHANHXUAN_CLIENT_HOST']):
                  raise RuntimeError('Archive provenance marker mismatch')
              for required in (
                  'server/entry.mjs',
                  'client/index.html',
                  'aquathanhxuan-staging-build.json',
                  'client/aquathanhxuan-staging-build.json',
              ):
                  if required not in names:raise RuntimeError('Missing staged bundle file: '+required)
              if z.read('aquathanhxuan-staging-build.json') != z.read('client/aquathanhxuan-staging-build.json'):
                  raise RuntimeError('Root/client provenance markers differ')
          print('PASS: ZIP contains dev server/client and provenance, no private environment file.')
          PY
          echo "AQUA_BUILD_STAGE=VERIFY_STAGING_ZIP_SECURITY_AND_SOURCE_PROVENANCE_PASS $(date -u +%FT%TZ)"
      - name: Upload compiled staging archive by Python FTP_TLS
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          echo "AQUA_BUILD_STAGE=PYTHON_FTPS_UPLOAD_START $(date -u +%FT%TZ)"
          timeout --signal=TERM --kill-after=10s 360s python3 -u actions-hub/scripts/aquathanhxuan-resumable-ftps.py
          echo "AQUA_BUILD_STAGE=PYTHON_FTPS_UPLOAD_EXIT $(date -u +%FT%TZ)"
      - name: Verify provenance and activate staging bundle using signed PHP rollback
        shell: bash
        run: python3 actions-hub/scripts/aquathanhxuan-remote-unzip.py unpack
