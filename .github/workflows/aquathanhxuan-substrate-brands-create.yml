name: Aqua Nền requested children write-once
# Manual only after the initial guarded CMS category migration.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aquathanhxuan-substrate-taxonomy-writer
  cancel-in-progress: false
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aquathanhxuan-substrate-brands-create.cjs
