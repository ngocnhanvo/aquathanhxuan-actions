name: Aqua Thanh Xuân Visual Builder contracts (NO BUILD OR DEPLOY)
# Verify readonly Product click bypasses generic image editor in Builder.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-visual-builder-ci.yml'
      - 'scripts/aquathanhxuan-visual-builder-browser.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - name: Checkout approved browser contract
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout Aqua Thanh Xuân Astro source (no build)
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-astro
          persist-credentials: false
      - name: Checkout Aqua Thanh Xuân PHP source (no deployment)
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore small npm driver cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: aquathanhxuan-vb-playwright-1.64.0-ts-5.8.3-${{ runner.os }}
      - name: Install matching driver (Chromium preinstalled)
        run: npm install --prefix .qa --no-save --no-package-lock --ignore-scripts --no-audit --no-fund --prefer-offline playwright@1.64.0 typescript@5.8.3
      - name: Exercise actual preview guards in Chromium
        run: node scripts/aquathanhxuan-visual-builder-browser.mjs
        env:
          ASTRO_SOURCE: source-astro
          PHP_SOURCE: source-php
      - name: Upload synthetic preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquathanhxuan-visual-builder-preview-contract
          path: artifacts/visual-builder
          if-no-files-found: ignore

  native-cells:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current WordPress source (no deployment)
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      - name: Validate native Hero, Sale and generic Product reference contracts
        shell: bash
        run: |
          set -euo pipefail
          php --version
          php -l wp-content/plugins/esc-visual-builder/includes/site-config.php
          php -l wp-content/plugins/esc-visual-builder/includes/text-editor.php
          php -l wp-content/plugins/esc-visual-builder/includes/text-editor-ui.php
          php wp-content/plugins/esc-visual-builder/tests/site-config.dynamic.test.php
          php wp-content/plugins/esc-visual-builder/tests/text-image-cells.test.php
          php -l wp-content/plugins/esc-visual-builder/includes/item-manager.php
          php -l wp-content/plugins/esc-visual-builder/includes/item-section-ui.php
          php wp-content/plugins/esc-visual-builder/tests/items-and-sections.test.php
          php wp-content/plugins/esc-visual-builder/tests/item-ui-script.test.php > /tmp/aqua-vb-items.js
          node --check /tmp/aqua-vb-items.js
      - name: Identify PHP source revision
        run: git rev-parse HEAD

  homepage-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current Astro master (no deployment)
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Test aligned homepage widths and all genuine Nền category children
        run: pnpm exec vitest run src/lib/wordpress/tablepress/home00.test.ts src/lib/wordpress/tablepress/home01.test.ts src/lib/wordpress/tablepress/home02.test.ts src/lib/wordpress/tablepress/home02Catalog.test.ts src/lib/wordpress/tablepress/home02Products.test.ts
      - name: Identify source revision
        run: git rev-parse HEAD

  home02-status:
    needs: [preview-browser, native-cells, homepage-data]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const path='chatgpt/home02products-tests.json';
            const content=JSON.stringify({
              run_id:context.runId,
              source_sha:context.sha,
              preview:'${{ needs.preview-browser.result }}',
              native:'${{ needs.native-cells.result }}',
              data:'${{ needs.homepage-data.result }}',
              checked_at:new Date().toISOString()
            },null,2)+'\\n';
            const ref=context.ref.replace('refs/heads/','');
            const old=await github.rest.repos.getContent({
              owner:context.repo.owner,repo:context.repo.repo,path,ref
            }).catch(e=>e.status===404?null:Promise.reject(e));
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,branch:ref,
              message:'Record Home 02 source contract test results',
              content:Buffer.from(content).toString('base64'),
              ...(old?.data?.sha?{sha:old.data.sha}:{})
            });
