name: Aqua LCP rule bisect (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-lcp-rule-bisect.yml'
permissions:
  contents: read
jobs:
  bisect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install diagnostic tools
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0 postcss@8.5.6
      - name: Isolate CSS rules that prevent LCP
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import postcss from 'postcss';
          const url='https://aquathanhxuan.io.vn/';
          const styleUrl=url+'_astro/Layout.CqAepo0p.css';
          const response=await fetch(styleUrl);
          if(!response.ok)throw Error('CSS fetch '+response.status);
          const raw=await response.text();
          const root=postcss.parse(raw);
          const nodes=root.nodes;
          console.log('CSS_SOURCE '+JSON.stringify({url:styleUrl,length:raw.length,rules:nodes.length,first:nodes.slice(0,3).map(n=>n.toString().slice(0,90)),last:nodes.slice(-3).map(n=>n.toString().slice(0,90))}));
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          let attempt=0;
          async function test(label,a,b,override=null){
            attempt++;
            const body = override || (a<0?raw:postcss.root({nodes:nodes.filter((_,i)=>i<a||i>=b).map(n=>n.clone())}).toString());
            const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true});
            const page=await ctx.newPage();
            await page.addInitScript(()=>{window.__lcp=[];new PerformanceObserver(l=>l.getEntries().forEach(e=>window.__lcp.push({size:e.size,url:e.url,tag:e.element?.tagName,t:e.startTime}))).observe({type:'largest-contentful-paint',buffered:true})});
            await page.route('**/*',async route=>{
              if(route.request().url().startsWith(styleUrl)){
                const response=await route.fetch();
                return route.fulfill({response,body,headers:{...response.headers(),'content-type':'text/css; charset=utf-8'}});
              }
              return route.continue();
            });
            try{
              const http=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(2900);
              const result=await page.evaluate(()=>({lcp:window.__lcp,bodyLength:document.body?.innerText.length,
                hero:document.querySelector('.aqua-hero__slide[data-active="true"] img')?.getBoundingClientRect().toJSON(),
                firstHeroStyle:(()=>{const e=document.querySelector('.aqua-hero__slide[data-active="true"]');return e?{position:getComputedStyle(e).position,opacity:getComputedStyle(e).opacity}:null})()}));
              const pass=result.lcp?.length>0;
              console.log('CSS_BISECT '+JSON.stringify({attempt,label,remove:[a,b],http:http?.status(),pass,...result}));
              return pass;
            }catch(e){console.log('CSS_BISECT_ERROR '+JSON.stringify({attempt,label,error:e.message}));return false}
            finally{await ctx.close()}
          }
          await test('control',-1,-1);
          await test('baseline',-1,-1);
          for(const [index,property] of [
            [58,'overscroll-behavior-inline'],[58,'scroll-snap-type'],
            [58,'scroll-behavior'],[58,'scrollbar-width'],
            [58,'gap'],[58,'padding'],[58,'display'],[58,'overflow-x'],
            [60,'scroll-snap-align'],[60,'flex'],[60,'min-width'],
            [60,'overflow'],[60,'transition'],
          ]){
            const modified=root.clone();
            modified.nodes[index].walkDecls(property,decl=>decl.remove());
            await test('remove-'+index+'-'+property,-1,-1,modified.toString());
          }
          await browser.close();
          NODE
