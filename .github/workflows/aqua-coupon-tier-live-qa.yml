name: Aqua MF5/MF10 live cart tiers (NO ORDERS)
on:
  push:
    branches: [main]
    paths:
      - 'qa-requests/aqua-coupon-tier-live.json'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check scripts/aqua-coupon-tier-live-qa.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Validate 259k and 1.295m cart groups, clean cart and create no orders
        run: node scripts/aqua-coupon-tier-live-qa.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-coupon-tier-live
          path: artifacts/aqua-coupon-tier-live
          retention-days: 14
          if-no-files-found: ignore
