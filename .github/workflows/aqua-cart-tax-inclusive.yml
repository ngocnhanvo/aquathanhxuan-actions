name: Aqua WooCommerce tax-inclusive pricing (CMS ONLY, NO ORDERS)
on:
  push:
    branches: [main]
    paths:
      - 'cms-requests/aqua-cart-tax-inclusive.json'
permissions:
  contents: read
concurrency:
  group: aqua-woo-tax-inclusive
  cancel-in-progress: false
jobs:
  configure-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check scripts/aqua-cart-tax-inclusive.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Set only inclusive-tax Woo price settings and verify disposable cart
        run: node scripts/aqua-cart-tax-inclusive.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-tax-inclusive-cart-qa
          path: artifacts/aqua-tax-inclusive
          retention-days: 14
          if-no-files-found: ignore
