name: Aqua support Pages shell labels native ESC migration (CMS only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aqua-support-shell-labels-install.yml'
      - 'scripts/aqua-support-shell-labels-install.cjs'
permissions:
  contents: read
concurrency:
  group: aqua-support-shell-native-labels
  cancel-in-progress: false
jobs:
  native-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check scripts/aqua-support-shell-labels-install.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Append only UI shell labels to five published native Support Tables
        run: node scripts/aqua-support-shell-labels-install.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-support-shell-native-labels
          path: artifacts/aqua-support-shell/
          if-no-files-found: ignore
          retention-days: 14
