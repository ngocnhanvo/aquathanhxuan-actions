name: Aqua Cubic 40 product read-only diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'audit-requests/combo-cubic40.json'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check scripts/aqua-combo-cubic40-diagnostic.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Read public URL, original source and authenticated WordPress product
        run: node scripts/aqua-combo-cubic40-diagnostic.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-combo-cubic40-diagnostic
          path: artifacts/aqua-combo-cubic40
          retention-days: 14
          if-no-files-found: ignore
