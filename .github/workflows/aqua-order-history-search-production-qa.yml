name: Aqua order history search and ESC Table production browser QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aqua-order-history-search-production-qa.yml'
      - 'scripts/aqua-order-history-search-production-qa.cjs'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate script syntax
        run: node --check scripts/aqua-order-history-search-production-qa.cjs
      - name: Install browser driver matching container
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Test customer searches, paging, guest isolation, mobile and ESC Builder edit coordinates
        run: node scripts/aqua-order-history-search-production-qa.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-order-history-search-browser-evidence
          path: artifacts/aqua-order-history-search/
          if-no-files-found: ignore
          retention-days: 14
