name: Aqua Lighthouse and PSI diagnostic (read-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-lighthouse-diagnostic.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      URL: https://aquathanhxuan.io.vn/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Lighthouse CLI and inspect Chrome
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund lighthouse@13.0.1
          mkdir -p artifacts/lighthouse
      - name: Run independent mobile and desktop Lighthouse audits
        shell: bash
        run: |
          set +e
          for device in mobile desktop; do
            echo "::group::Lighthouse $device"
            flags=""
            if [ "$device" = "desktop" ]; then flags="--preset=desktop"; fi
            node_modules/.bin/lighthouse "$URL" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" $flags --only-categories=performance --output=json --output-path="artifacts/lighthouse/$device.json" --quiet --max-wait-for-load=60000
            echo "LIGHTHOUSE_${device}_EXIT=$?"
            echo "::endgroup::"
          done
          exit 0
      - name: Compare Google PageSpeed API response (best effort)
        shell: bash
        run: |
          set +e
          curl --retry 1 --connect-timeout 15 --max-time 120 -sS -G 'https://www.googleapis.com/pagespeedonline/v5/runPagespeed' --data-urlencode "url=$URL" --data-urlencode 'strategy=mobile' --data-urlencode 'category=PERFORMANCE' -o artifacts/lighthouse/psi-mobile.json -w 'PAGESPEED_HTTP=%{http_code}\n'
          exit 0
      - name: Check native Chrome LCP observer independent of Lighthouse
        shell: bash
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          for(const [label,url,viewport] of [
            ['aqua-mobile','https://aquathanhxuan.io.vn/',{width:390,height:844}],
            ['aqua-desktop','https://aquathanhxuan.io.vn/',{width:1440,height:900}],
            ['baseline-mobile','https://www.google.com/',{width:390,height:844}]
          ]){
            const context=await browser.newContext({viewport,deviceScaleFactor:1,isMobile:label.includes('mobile')});
            const page=await context.newPage();
            const requestFailures=[];const jsErrors=[];
            page.on('requestfailed',r=>requestFailures.push({url:r.url().slice(0,120),failure:r.failure()}));
            page.on('pageerror',e=>jsErrors.push(e.message.slice(0,200)));
            await page.addInitScript(()=>{
              window.__lcpEvents=[];
              try{new PerformanceObserver(list=>{for(const e of list.getEntries()){window.__lcpEvents.push({startTime:e.startTime,size:e.size,url:e.url,tag:e.element?.tagName,classes:e.element?.className?.toString().slice(0,140)})}}).observe({type:'largest-contentful-paint',buffered:true})}catch(e){window.__lcpError=e.message}
            });
            try{await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(5500);
              const data=await page.evaluate(()=>({url:location.href,ready:document.readyState,visibility:document.visibilityState,title:document.title,bodyTextLength:document.body?.innerText?.length||0,images:document.images.length,events:window.__lcpEvents,lcpError:window.__lcpError}));
              await page.screenshot({path:'artifacts/lighthouse/'+label+'-browser.png'});
              console.log('NATIVE_LCP '+JSON.stringify({label,...data,requestFailures:requestFailures.slice(0,10),jsErrors:jsErrors.slice(0,8)}));
              fs.writeFileSync('artifacts/lighthouse/'+label+'-native.json',JSON.stringify({label,...data,requestFailures,jsErrors},null,2));
            }catch(e){console.log('NATIVE_LCP_ERROR '+label+' '+e.message)}
            await context.close();
          }
          await browser.close();
          NODE
      - name: Isolate hero fade and LCP eligibility (browser-only A/B)
        shell: bash
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const combos=[
            ['mobile','control',''],
            ['mobile','no-slide-fades','.aqua-hero__slide,.aqua-hero__media img{transition:none!important;animation:none!important}'],
            ['mobile','nonzero-hidden-slide','.aqua-hero__slide:not([data-active="true"]){opacity:.0001!important;visibility:visible!important}'],
            ['mobile','static-text-probe',''],
            ['desktop','control',''],
            ['desktop','no-slide-fades','.aqua-hero__slide,.aqua-hero__media img{transition:none!important;animation:none!important}'],
            ['desktop','static-text-probe',''],
          ];
          for(const [device,variant,css] of combos){
            const context=await browser.newContext({viewport:device==='mobile'?{width:390,height:844}:{width:1440,height:900},isMobile:device==='mobile',deviceScaleFactor:1});
            const page=await context.newPage();
            await page.addInitScript(()=>{window.__lcp=[];new PerformanceObserver(list=>list.getEntries().forEach(e=>window.__lcp.push({t:e.startTime,size:e.size,url:e.url,tag:e.element?.tagName,cls:e.element?.className?.toString().slice(0,100)}))).observe({type:'largest-contentful-paint',buffered:true})});
            if(variant!=='control'){
              await page.route('https://aquathanhxuan.io.vn/**',async route=>{
                if(route.request().resourceType()!=='document')return route.continue();
                const response=await route.fetch();let html=await response.text();
                html=html.replace('</head>','<style id="lcp-ab-css">'+css+'</style></head>');
                if(variant==='static-text-probe')html=html.replace(/<body([^>]*)>/i,'<body$1><h1 style="position:absolute;top:160px;left:20px;z-index:99999;font:bold 52px/1.2 Arial;background:white;color:black">VISIBLE LCP TEST PROBE</h1>');
                return route.fulfill({response,body:html,headers:{...response.headers(),'content-type':'text/html; charset=utf-8'}});
              });
            }
            try{
              await page.goto('https://aquathanhxuan.io.vn/',{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(4200);
              const result=await page.evaluate(()=>({
                lcp:window.__lcp,ready:document.readyState,
                saleColor: (()=>{const e=document.querySelector('.aqua-sale__prices strong');return e?getComputedStyle(e).color:null})(),
                slides:[...document.querySelectorAll('.aqua-hero__slide')].slice(0,4).map(e=>({active:e.dataset.active,audience:e.dataset.audience,opacity:getComputedStyle(e).opacity,visibility:getComputedStyle(e).visibility,rect:{w:e.getBoundingClientRect().width,h:e.getBoundingClientRect().height},img:{src:e.querySelector('img')?.currentSrc?.slice(0,180),complete:e.querySelector('img')?.complete,naturalWidth:e.querySelector('img')?.naturalWidth}})),
              }));
              console.log('LCP_AB '+JSON.stringify({device,variant,...result}));
              fs.writeFileSync('artifacts/lighthouse/ab-'+device+'-'+variant+'.json',JSON.stringify(result,null,2));
            }catch(e){console.log('LCP_AB_ERROR '+device+' '+variant+' '+e.message)}
            await context.close();
          }
          await browser.close();
          NODE
      - name: Report errors, LCP, screenshots, and key performance metrics
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for(const device of ['mobile','desktop','psi-mobile']){
            const p='artifacts/lighthouse/'+device+'.json';
            if(!fs.existsSync(p)){console.log(device+' MISSING_REPORT');continue;}
            let d;
            try{d=JSON.parse(fs.readFileSync(p,'utf8'));}catch(e){console.log(device+' BAD_JSON '+e.message);continue;}
            const lhr=d.lighthouseResult||d;
            const x={
              device,
              apiError:d.error?.message||d.error?.status||null,
              runtimeError:lhr.runtimeError||null,
              requestedUrl:lhr.requestedUrl,
              finalUrl:lhr.finalDisplayedUrl||lhr.finalUrl,
              performanceScore:lhr.categories?.performance?.score,
              metrics:Object.fromEntries(['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift','interactive'].map(id=>{
                const a=lhr.audits?.[id]||{};
                return [id,{score:a.score,value:a.numericValue,display:a.displayValue,error:a.errorMessage,explanation:a.explanation}];
              })),
              auditErrors:Object.entries(lhr.audits||{}).filter(([k,a])=>a.scoreDisplayMode==='error').map(([k,a])=>({id:k,error:a.errorMessage})).slice(0,20),
              environment:{host:lhr.environment?.hostUserAgent,network:lhr.environment?.networkUserAgent},
            };
            console.log('AUDIT_DIAGNOSIS '+JSON.stringify(x));
            fs.writeFileSync('artifacts/lighthouse/'+device+'-summary.json',JSON.stringify(x,null,2)+'\n');
            const screenshot=lhr.audits?.['final-screenshot']?.details?.data;
            if(typeof screenshot==='string'&&screenshot.startsWith('data:image/')){
              fs.writeFileSync('artifacts/lighthouse/'+device+'-final.png',Buffer.from(screenshot.split(',')[1],'base64'));
            }
          }
          NODE
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquathanhxuan-lighthouse-diagnostics
          path: artifacts/lighthouse
          retention-days: 7
          if-no-files-found: warn
