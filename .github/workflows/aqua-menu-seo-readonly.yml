name: Aqua menu legacy SEO and redirects inventory (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - 'audit-requests/aqua-menu-seo.json'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/aqua-menu-seo-readonly.cjs
      - name: Compare original and new category menu SEO and HTTP redirects
        run: node scripts/aqua-menu-seo-readonly.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-menu-seo-audit
          path: artifacts/aqua-menu-seo-audit
          retention-days: 14
          if-no-files-found: ignore
