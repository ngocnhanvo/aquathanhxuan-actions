name: Aqua cart and checkout read-only configuration audit
on:
  push:
    branches: [main]
    paths:
      - 'audit-requests/aqua-checkout.json'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check scripts/aqua-checkout-readonly-audit.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Read public route and WooCommerce gateway/coupon configuration
        run: node scripts/aqua-checkout-readonly-audit.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-checkout-readonly-audit
          path: artifacts/aqua-checkout-audit
          retention-days: 14
          if-no-files-found: ignore
