name: Aqua product card add-to-cart production browser QA
on:
  push:
    branches: [main]
    paths:
      - 'qa-requests/product-card-cart-ui.json'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/aqua-product-card-cart-ui-qa.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aqua-product-card-cart-ui-qa.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-product-card-cart-production
          path: artifacts/product-card-cart
          if-no-files-found: ignore
          retention-days: 14
