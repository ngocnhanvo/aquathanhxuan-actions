name: Aqua Visual Builder preview label controlled Save and restore QA
on:
  push:
    branches: [main]
    paths:
      - 'qa-requests/aqua-builder-safe-save.json'
permissions:
  contents: read
concurrency:
  group: aqua-builder-preview-controlled-one-cell-save
  cancel-in-progress: false
jobs:
  save-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check scripts/aqua-builder-safe-save-qa.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Save and restore one preview-only ESC label; assert exact REST readback
        run: node scripts/aqua-builder-safe-save-qa.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-builder-controlled-save-restore
          path: artifacts/aqua-builder-safe-save/
          if-no-files-found: error
          retention-days: 14
