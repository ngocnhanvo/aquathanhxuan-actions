name: Aqua Thanh Xuân deploy transport contracts (NO BUILD OR FTP)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-production-deploy.yml'
      - '.github/workflows/aquathanhxuan-php-release.yml'
      - '.github/workflows/aquathanhxuan-deploy-contract-ci.yml'
      - 'scripts/aquathanhxuan-*-delta-package.py'
      - 'scripts/aquathanhxuan-remote-unzip.py'
      - 'scripts/aquathanhxuan-resumable-ftps.py'
      - 'scripts/aquathanhxuan-php-live-release.py'
      - 'tests/aquathanhxuan-*.test.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  astro-optimization-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current Aqua Astro production source (NO DEPLOY)
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify Page and redirect concurrency plus TablePress dependency cache
        run: |
          pnpm exec vitest run \
            src/lib/wordpress/pages/index.parallel.test.ts \
            src/lib/wordpress/redirects/index.parallel.test.ts \
            src/lib/wordpress/tablepress/processedCache.test.ts \
            src/lib/wordpress/tablepress/index.parallel.test.ts \
            src/lib/wordpress/pages/ssrActionAudit.test.ts \
            src/lib/wordpress/pages/publishedPageAudit.test.ts \
            src/lib/wordpress/pages/homepageContentAudit.test.ts
      - name: Identify tested Astro source SHA
        run: git rev-parse HEAD
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout Aqua Thanh Xuân PHP contract source (no deployment)
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: PHP syntax and signed staging reconstruction contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l source-php/aquathanhxuan-unzip.php
          php -l source-php/aquathanhxuan-image-delta.php
          php source-php/tests/aquathanhxuan-image-delta.php
          php source-php/tests/aquathanhxuan-static-delta.php
      - name: Python packaging, compatibility and ZIP roundtrip contracts
        shell: bash
        env:
          AQUATHANHXUAN_PHP_SOURCE: source-php
        run: |
          set -euo pipefail
          command -v php
          python3 -m py_compile scripts/aquathanhxuan-resumable-ftps.py
          for test in tests/aquathanhxuan-*.test.py; do
            python3 "$test" -v
          done
