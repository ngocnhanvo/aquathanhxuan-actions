name: Aqua inspect native Home 02 Product API metadata
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-home02products-inspect.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Inspect actual Product source selectors
        id: inspect
        run: node scripts/aquathanhxuan-home02products-table-inspect.cjs
      - name: Record read-only table metadata audit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const path='chatgpt/home02products-table-inspect.json';
            const payload=fs.existsSync(path)?JSON.parse(fs.readFileSync(path,'utf8')):{error:'Inspection produced no report'};
            payload.run_id=context.runId;payload.outcome='${{ steps.inspect.outcome }}';
            const ref=context.ref.replace('refs/heads/','');
            const old=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref})
              .catch(e=>e.status===404?null:Promise.reject(e));
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,branch:ref,
              message:'Record native Home 02 API metadata inspection',
              content:Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64'),
              ...(old?.data?.sha?{sha:old.data.sha}:{})
            });
