name: Aqua Home 02 native ESC Table create (single table, rollback)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-home02-native-create.yml'
permissions:
  contents: read
jobs:
  create-home02:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Playwright driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Create verified native home_02 and read back
        run: node scripts/aquathanhxuan-home02-native-create.cjs
