name: Aqua native equipment Page Insert Code
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-equipment-native-page-insert.yml'
      - 'scripts/aquathanhxuan-equipment-page-insert.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aquathanhxuan-equipment-native-page-insert
  cancel-in-progress: false
jobs:
  insert:
    if: github.repository == 'ngocnhanvo/aquathanhxuan-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/aquathanhxuan-equipment-page-insert.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify ESC Table ownership and insert native Parent Page shortcodes
        run: node scripts/aquathanhxuan-equipment-page-insert.cjs
