name: Aqua Atman source vs target Product content audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aqua-brand-atman-content-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/aqua-brand-atman-content-audit.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aqua-brand-atman-content-audit.cjs
