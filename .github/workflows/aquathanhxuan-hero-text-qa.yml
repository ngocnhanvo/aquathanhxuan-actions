name: Aqua Hero text overlay production QA one-shot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/aquathanhxuan-hero-text-qa.yml']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify CMS toggle rendered on production
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const origin='https://aquathanhxuan.io.vn';
          const expected='f4a9131ae7a4d23236386be3bee1a6cf53c47a5f';
          const cases=[[1440,900],[1024,768],[768,1024],[844,390],[390,844]];
          (async()=>{
            const marker=await fetch(origin+'/aquathanhxuan-staging-build.json?qa='+Date.now());
            assert.equal(marker.status,200,'Production marker fetch');
            const meta=await marker.json();
            assert.equal(meta.commit,expected,'Production deploy SHA');
            const browser=await chromium.launch({headless:true});
            try {
              for(const [width,height] of cases){
                const page=await browser.newPage({viewport:{width,height}});
                await page.goto(origin+'/?hero_show_text_qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
                const hero=page.locator('[data-aqua-home-hero]');
                await hero.waitFor({state:'visible',timeout:20000});
                const slides=hero.locator('[data-hero-slide]');
                assert.equal(await slides.count(),2,'Slide count');
                assert.equal(await slides.nth(0).getAttribute('data-show-text'),'false','First banner show_text=0');
                assert.equal(await slides.nth(1).getAttribute('data-show-text'),'true','Second banner show_text=1');
                assert.equal(await slides.nth(0).locator('.aqua-hero__shade').count(),0,'First overlay dark shade absent');
                assert.equal(await slides.nth(0).locator('.aqua-hero__inner').count(),0,'First overlay text absent');
                assert.equal(await slides.nth(1).locator('h2').count(),1,'Second banner headline retained');
                assert.equal(await slides.nth(1).locator('a[href="/san-pham"]').count(),1,'Second CTA retained');
                const images=hero.locator('[data-hero-slide] img');
                assert.equal(await images.count(),2,'Images preserved');
                await page.waitForFunction(()=>{const img=document.querySelector('[data-aqua-home-hero] [data-hero-slide] img');return img&&img.naturalWidth>0},{},{timeout:12000});
                const sizes=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,width:innerWidth}));
                assert(sizes.scroll<=sizes.width+1,'No horizontal overflow');
                await hero.locator('[data-hero-dot]').nth(1).click();
                await page.waitForFunction(()=>document.querySelectorAll('[data-aqua-home-hero] [data-hero-slide][data-active="true"]')[0]?.getAttribute('data-show-text')==='true',{},{timeout:5000});
                console.log('HERO_TEXT_QA_VIEWPORT=PASS '+width+'x'+height);
                await page.close();
              }
            } finally {await browser.close()}
            console.log('HERO_TEXT_PRODUCTION_QA=PASS source='+expected);
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
