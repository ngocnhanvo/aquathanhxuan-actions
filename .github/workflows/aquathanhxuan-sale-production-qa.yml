name: Aqua Sale production QA one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-sale-production-qa.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Diagnose deployed Sale data path
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');

          const frontend='https://aquathanhxuan.io.vn';
          const wp='https://admin.aquathanhxuan.io.vn';
          const expected='f9736ca7d253f7048733c37816b4113952144aa6';

          const getJson=async(url)=>{
            const r=await fetch(url,{headers:{'cache-control':'no-cache','user-agent':'AquaSaleDiagnostic/1.0'}});
            const text=await r.text();
            if(!r.ok) throw new Error('HTTP '+r.status+' '+url+' '+text.slice(0,300));
            return JSON.parse(text);
          };

          (async()=>{
            const marker=await getJson(frontend+'/aquathanhxuan-staging-build.json?qa='+Date.now());
            assert.equal(marker.commit,expected,'Production SHA');

            const [prodPage,cmsPage,home01,products]=await Promise.all([
              getJson(frontend+'/data/page-default.json?qa='+Date.now()),
              getJson(wp+'/wp-json/wp/v2/pages/82454?_fields=id,content&qa='+Date.now()),
              getJson(wp+'/wp-json/tablepress/v1/table/home_01?qa='+Date.now()),
              getJson(frontend+'/data/cms-products.json?qa='+Date.now()),
            ]);

            const cmsRendered=String(cmsPage?.content?.rendered||'');
            const prodContent=String(prodPage?.content||'');
            const contents=Array.isArray(prodPage?.contents)?prodPage.contents:[];
            const home01Block=contents.find(x=>String(x?.shortcode||'').toLowerCase()==='home_01');
            const tableItems=Array.isArray(home01?.items)?home01.items:[];

            console.log('CMS_HAS_HOME_01='+cmsRendered.includes('home_01'));
            console.log('PROD_CONTENT_HAS_HOME_01='+prodContent.includes('[table id=home_01 /]'));
            console.log('PROD_SHORTCODES='+contents.map(x=>x?.shortcode).join(','));
            console.log('PROD_HOME_01_BLOCK='+Boolean(home01Block));
            console.log('PROD_HOME_01_DATA_ITEMS='+(Array.isArray(home01Block?.data?.items)?home01Block.data.items.length:-1));
            console.log('CMS_HOME_01_META_API='+String(home01?.meta?.api||''));
            console.log('CMS_HOME_01_ITEMS='+tableItems.length);
            console.log('PROD_PRODUCTS_COUNT='+(Array.isArray(products)?products.length:-1));
            console.log('PROD_PRODUCT_IDS='+(Array.isArray(products)?products.map(p=>p?._id||p?.id).join(','):''));

            assert(cmsRendered.includes('home_01'),'CMS homepage shortcode missing');
            assert.equal(String(home01?.meta?.api||''),'Product','home_01 Product source');
            assert.equal(tableItems.length,13,'home_01 row count');
            assert.equal(Array.isArray(products)?products.length:-1,12,'Production products count');

            if(!prodContent.includes('[table id=home_01 /]')){
              throw new Error('DIAGNOSIS=PAGE_CACHE_MISSED_HOME_01');
            }
            if(!home01Block){
              throw new Error('DIAGNOSIS=PAGE_CONTENTS_MISSED_HOME_01');
            }
            if(!Array.isArray(home01Block?.data?.items) || home01Block.data.items.length<12){
              throw new Error('DIAGNOSIS=HOME_01_EMBED_OR_PRODUCT_MAP_EMPTY');
            }
            console.log('SALE_DATA_PATH=PASS');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
