name: Aqua read-only Home00 mobile banner preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-home00-mobile-preflight.yml'
      - 'scripts/aquathanhxuan-home00-mobile-preflight.cjs'
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'ngocnhanvo/aquathanhxuan-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --check scripts/aquathanhxuan-home00-mobile-preflight.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aquathanhxuan-home00-mobile-preflight.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-home00-mobile-preflight
          path: artifacts/home00-mobile-preflight/
          if-no-files-found: ignore
          retention-days: 7
