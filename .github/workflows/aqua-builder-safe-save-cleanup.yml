name: Aqua Visual Builder preview-only label recovery
on:
  push:
    branches: [main]
    paths:
      - 'qa-requests/aqua-builder-save-cleanup.json'
permissions:
  contents: read
concurrency:
  group: aqua-builder-preview-controlled-one-cell-save
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check scripts/aqua-builder-safe-save-cleanup.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Read and restore one checkout preview label, verify zero residues
        run: node scripts/aqua-builder-safe-save-cleanup.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-builder-label-cleanup-proof
          path: artifacts/aqua-builder-save-cleanup/
          if-no-files-found: error
          retention-days: 14
