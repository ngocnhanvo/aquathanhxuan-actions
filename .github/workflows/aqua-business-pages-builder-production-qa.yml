name: Aqua nine business and support Pages Visual Builder production QA (read-only)
on:
  push:
    branches: [main]
    paths:
      - 'qa-requests/aqua-business-pages-builder-production.json'
permissions:
  contents: read
concurrency:
  group: aqua-nine-pages-builder-production-qa
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check scripts/aqua-business-pages-builder-production-qa.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify 9 Page previews and live ESC cell coordinates without mutations
        run: node scripts/aqua-business-pages-builder-production-qa.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-nine-page-builder-qa
          path: artifacts/aqua-business-pages-builder/
          if-no-files-found: ignore
          retention-days: 14
