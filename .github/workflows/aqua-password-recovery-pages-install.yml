name: Aqua password recovery WordPress Pages CMS ONLY
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aqua-password-recovery-pages-install.yml'
permissions:
  contents: read
concurrency:
  group: aqua-password-recovery-cms-pages
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check scripts/aqua-password-recovery-pages-install.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Add or verify only two WordPress Pages
        run: node scripts/aqua-password-recovery-pages-install.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-password-recovery-pages-result
          path: artifacts/aqua-password-recovery-pages/
          if-no-files-found: ignore
          retention-days: 14
