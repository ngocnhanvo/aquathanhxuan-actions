name: Aqua Home 04 native ESC Table create (verified products)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-home04-native-create.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aquathanhxuan-home04-cms-write
  cancel-in-progress: false
jobs:
  create-home04:
    if: github.repository == 'ngocnhanvo/aquathanhxuan-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
      - name: Check native Home 04 writer syntax
        run: node --check scripts/aquathanhxuan-home04-native-create.cjs
      - name: Install matching Playwright driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Create verified Home 04 from real WordPress product media
        run: node scripts/aquathanhxuan-home04-native-create.cjs

# Retry after supporting relative WooCommerce product and media permalinks.
