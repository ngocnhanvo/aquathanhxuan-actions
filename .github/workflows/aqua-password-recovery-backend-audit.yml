name: Aqua password recovery WordPress backend source audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aqua-password-recovery-backend-audit.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Check recovery backend syntax and frontend host source
        working-directory: source-php
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/themes/vibe-code-theme/inc/user/lostpass.php
          echo 'RECOVERY_PHP_SOURCE_SHA='$(git rev-parse HEAD)
          if git grep -n -F 'get_site_domain(' -- wp-content/themes/vibe-code-theme/inc/user/lostpass.php; then
            echo '::error::Password recovery must not call the undefined global get_site_domain'
            exit 1
          fi
          php -l tests/aqua-password-recovery.test.php
          php tests/aqua-password-recovery.test.php
          echo 'RECOVERY_PHP_BACKEND_SOURCE_PASS'
