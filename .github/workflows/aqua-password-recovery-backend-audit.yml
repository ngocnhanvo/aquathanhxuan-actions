name: Aqua password recovery WordPress backend source audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aqua-password-recovery-backend-audit.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Check recovery backend syntax and frontend host source
        working-directory: source-php
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/themes/vibe-code-theme/inc/user/lostpass.php
          echo 'RECOVERY_PHP_SOURCE_SHA='$(git rev-parse HEAD)
          matches="$(git grep -l -E 'function[[:space:]]+get_site_domain[[:space:]]*[(]' -- 'wp-content/**/*.php' || true)"
          if [ -z "$matches" ]; then
            echo '::error::WordPress reset mail helper get_site_domain is missing'
            exit 1
          fi
          echo 'RECOVERY_DOMAIN_HELPER_FILES:'
          printf '%s\\n' "$matches" | head -n 10
          echo 'RECOVERY_DOMAIN_HELPER_SCAN=PASS'
          echo 'RECOVERY_PHP_BACKEND_SOURCE_PASS'
