name: Aqua light-category source and target inventory
on:
  push:
    branches: [main]
    paths:
      - 'cms-requests/light-catalog-inventory.json'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/aqua-light-catalog-inventory.py
      - name: Read-only comparison with source and target WooCommerce
        run: python3 scripts/aqua-light-catalog-inventory.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-light-inventory
          path: artifacts/aqua-light/inventory.json
          if-no-files-found: ignore
          retention-days: 14
