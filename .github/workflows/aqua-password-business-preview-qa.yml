name: Aqua password business Pages production Visual Builder QA (read only)
on:
  push:
    branches: [main]
    paths:
      - 'qa-requests/aqua-password-business-preview.json'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check scripts/aqua-password-business-preview-qa.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Check WordPress native labels and Astro Visual Builder preview states
        run: node scripts/aqua-password-business-preview-qa.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-password-business-builder-qa
          path: artifacts/aqua-password-business-preview/
          if-no-files-found: ignore
          retention-days: 14
