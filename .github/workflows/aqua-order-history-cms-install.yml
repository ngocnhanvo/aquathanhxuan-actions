name: Aqua order history WordPress Page and Rewrite (CMS ONLY)
on:
  push:
    branches: [main]
    paths:
      - 'cms-requests/aqua-order-history-page.json'
permissions:
  contents: read
concurrency:
  group: aqua-order-history-cms-page
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check scripts/aqua-order-history-page-install.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Read existing CMS and add only missing published Page and Rewrite
        run: node scripts/aqua-order-history-page-install.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-order-history-cms-install
          path: artifacts/aqua-order-history-page
          if-no-files-found: ignore
          retention-days: 14
