name: Aqua Home 03 homepage native Insert Code
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-home03-insert-code.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aquathanhxuan-home03-homepage-write
  cancel-in-progress: false
jobs:
  insert-code:
    if: github.repository == 'ngocnhanvo/aquathanhxuan-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
      - name: Check shortcode writer syntax
        run: node --check scripts/aquathanhxuan-home03-insert-code.cjs
      - name: Install matching Playwright driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Insert Home 03 only with native ESC Table Insert Code
        run: node scripts/aquathanhxuan-home03-insert-code.cjs

# Retry one bounded WordPress navigation timeout; no CMS change on failed preflight.
