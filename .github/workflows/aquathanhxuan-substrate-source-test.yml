name: Aqua homepage substrate source tests (NO BUILD)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-substrate-source-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact Astro source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-astro
          ref: d03f1d72c7b8cea06caed96025e7fc5ee1a6358c
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run targeted homepage tests
        run: pnpm exec vitest run src/lib/wordpress/tablepress/home02.test.ts
      - name: Confirm source revision
        run: test "$(git rev-parse HEAD)" = "d03f1d72c7b8cea06caed96025e7fc5ee1a6358c"
