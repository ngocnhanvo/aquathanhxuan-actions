name: Aqua WooCommerce checkout backend Page binding (CMS ONLY)
on:
  push:
    branches: [main]
    paths:
      - 'cms-requests/aqua-checkout-woo-backend-pages.json'
permissions:
  contents: read
concurrency:
  group: aqua-woo-checkout-backend-pages
  cancel-in-progress: false
jobs:
  verify-and-bind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate scoped WordPress Page binding script
        run: node --check scripts/aqua-checkout-woo-backend-pages.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Bind only approved WordPress Pages and Woo settings, then verify
        run: node scripts/aqua-checkout-woo-backend-pages.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-woocommerce-checkout-backend-pages
          path: artifacts/aqua-woo-checkout-pages
          if-no-files-found: ignore
          retention-days: 14
