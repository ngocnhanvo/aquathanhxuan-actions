name: Aqua homepage final production and Builder QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-homepage-final-qa.yml'
      - 'scripts/aquathanhxuan-homepage-final-qa.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  homepage-final-qa:
    if: github.repository == 'ngocnhanvo/aquathanhxuan-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check homepage QA syntax
        run: node --check scripts/aquathanhxuan-homepage-final-qa.cjs
      - name: Install matching Playwright driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify production homepage on five viewports and Builder read-only
        run: node scripts/aquathanhxuan-homepage-final-qa.cjs
      - name: Upload homepage final screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquathanhxuan-homepage-final-qa
          path: artifacts/homepage-final
          if-no-files-found: ignore
          retention-days: 7
