name: Aqua legacy brand catalog parity inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aqua-brand-catalog-inventory.yml'
      - 'qa-requests/brand-catalog-inventory.json'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/aqua-brand-catalog-inventory.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aqua-brand-catalog-inventory.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aqua-brand-catalog-parity-oracle
          path: artifacts/brand-catalog
          if-no-files-found: warn
          retention-days: 10
