name: Aqua light catalog original data and SEO preflight
on:
  push:
    branches: [main]
    paths:
      - qa-requests/light-catalog-data-preflight.json
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      LIGHT_QA_REQUEST_PATH: qa-requests/light-catalog-data-preflight.json
      LIGHT_QA_DATA_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/aqua-light-catalog-production-qa.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aqua-light-catalog-production-qa.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-light-catalog-data-preflight
          path: artifacts/light-catalog-production/report.json
          if-no-files-found: ignore
          retention-days: 14
