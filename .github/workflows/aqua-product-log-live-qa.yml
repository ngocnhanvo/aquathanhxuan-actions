name: Aqua live WordPress Product logs paged read-only QA
on:
  push:
    branches: [main]
    paths:
      - 'qa-requests/product-log-live.json'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate live WordPress Product log pagination without CMS writes
        shell: bash
        run: node scripts/aqua-product-log-live-qa.cjs
