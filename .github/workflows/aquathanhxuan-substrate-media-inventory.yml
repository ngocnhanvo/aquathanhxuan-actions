name: Aqua homepage substrate media discovery (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-substrate-media-inventory.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - name: Find existing WordPress media and categories
        shell: bash
        run: |
          node <<'NODE'
          const env = Object.fromEntries((process.env.ENV_FILE||'').split(/\r?\n/).map(s=>s.match(/^\s*(WC_URL|WC_URL_CLIENT)\s*=\s*(.*?)\s*$/)).filter(Boolean).map(m=>[m[1],m[2].replace(/^['"]|['"]$/g,'')]));
          if(env.WC_URL!=='https://admin.aquathanhxuan.io.vn'||env.WC_URL_CLIENT!=='https://aquathanhxuan.io.vn')throw Error('INVALID_SITE_ORIGIN');
          const origin=env.WC_URL;
          (async()=>{
            for(const term of ['nền','cốt nền','soil','substrate','phân nền','ada','aquasoil']){
              const u=origin+'/wp-json/wp/v2/media?search='+encodeURIComponent(term)+'&per_page=50&_fields=id,title,alt_text,source_url,media_type';
              const r=await fetch(u,{headers:{accept:'application/json'}});
              const body=await r.json().catch(()=>null);
              console.log('MEDIA_SEARCH '+JSON.stringify({term,status:r.status,total:r.headers.get('x-wp-total'),items:Array.isArray(body)?body.slice(0,25).map(x=>({id:x.id,title:x.title?.rendered,alt:x.alt_text,src:x.source_url,media_type:x.media_type})):[]}));
            }
            for(const page of [1,2,3]){
              const u=origin+'/wp-json/wp/v2/media?per_page=100&page='+page+'&orderby=date&order=desc&_fields=id,date,title,alt_text,source_url,media_type';
              const r=await fetch(u,{headers:{accept:'application/json'}});
              const data=await r.json().catch(()=>null);
              console.log('MEDIA_RECENT '+JSON.stringify({page,status:r.status,total:r.headers.get('x-wp-total'),items:Array.isArray(data)?data.map(x=>({id:x.id,date:x.date,title:x.title?.rendered,alt:x.alt_text,src:x.source_url,kind:x.media_type})):[]}));
              if(!r.ok||!Array.isArray(data)||data.length<100)break;
            }
            for(const endpoint of [
              '/wp-json/wc/store/v1/products?category=1775&per_page=30',
              '/wp-json/wp/v2/product?product_cat=1775&per_page=30',
              '/wp-json/api/products?category=1775&per_page=30'
            ]){
              const r=await fetch(origin+endpoint,{headers:{accept:'application/json'}});
              const body=await r.json().catch(()=>null);
              const items=Array.isArray(body)?body:(Array.isArray(body?.products)?body.products:[]);
              console.log('SUBSTRATE_PRODUCTS '+JSON.stringify({endpoint,status:r.status,total:r.headers.get('x-wp-total'),type:Array.isArray(body)?'array':typeof body,items:items.slice(0,30).map(x=>({id:x.id,name:x.name||x.title?.rendered||x.title,slug:x.slug,images:(x.images||[]).slice(0,2).map(z=>({id:z.id,src:z.src,alt:z.alt})),image:x.image,description:String(x.short_description||'').slice(0,120)}))}));
            }
            const u=origin+'/wp-json/api/products/categories';
            const r=await fetch(u);
            const cats=await r.json().catch(()=>null);
            const flat=[];
            function walk(a){if(!Array.isArray(a))return;for(const o of a){if(!o||typeof o!=='object')continue;const name=String(o.name||o.title||'');if(/nền|đá|soil|substrate|cốt/i.test(name))flat.push({id:o.id,name,slug:o.slug,image:o.image?.url||o.image||null});walk(o.children);}}
            walk(cats);
            console.log('REAL_CATEGORIES '+JSON.stringify({status:r.status,matches:flat.slice(0,35)}));
          })().catch(e=>{console.error('MEDIA_DISCOVERY_FAILED='+e.message);process.exitCode=1});
          NODE

      - name: Inspect WooCommerce substrate products and recent WordPress media
        shell: bash
        run: |
          node <<'NODE'
          const env = Object.fromEntries((process.env.ENV_FILE||'').split(/\r?\n/).map(s=>s.match(/^\s*(WC_URL|WC_URL_CLIENT)\s*=\s*(.*?)\s*$/)).filter(Boolean).map(m=>[m[1],m[2].replace(/^['"]|['"]$/g,'')]));
          if(env.WC_URL!=='https://admin.aquathanhxuan.io.vn'||env.WC_URL_CLIENT!=='https://aquathanhxuan.io.vn')throw Error('INVALID_SITE_ORIGIN');
          const root=env.WC_URL;
          async function inspect(name,path,limit=100){
            const response=await fetch(root+path,{headers:{accept:'application/json'}});
            const json=await response.json().catch(()=>null);
            if(!response.ok)throw Error(name+'_HTTP_'+response.status);
            const list=Array.isArray(json)?json:Array.isArray(json?.products)?json.products:[];
            return {status:response.status,total:response.headers.get('x-wp-total'),items:list.slice(0,limit)};
          }
          (async()=>{
            const p=await inspect('PRODUCTS','/wp-json/wc/store/v1/products?category=1775&per_page=50',50);
            console.log('SUBSTRATE_PRODUCTS '+JSON.stringify({status:p.status,total:p.total,items:p.items.map(x=>({id:x.id,name:x.name,permalink:x.permalink,images:(x.images||[]).slice(0,2).map(i=>({id:i.id,src:i.src,alt:i.alt}))}))}));
            const candidates=[];
            for(let page=1;page<=3;page++){
              const m=await inspect('MEDIA','/wp-json/wp/v2/media?per_page=100&page='+page+'&_fields=id,date,title,alt_text,source_url,media_type',100);
              candidates.push(...m.items.filter(x=>x.media_type==='image').map(x=>({id:x.id,date:x.date,title:x.title?.rendered,alt:x.alt_text,src:x.source_url})));
              if(m.items.length<100)break;
            }
            console.log('RECENT_MEDIA_INVENTORY '+JSON.stringify({sampled:candidates.length,items:candidates.slice(0,100)}));
          })().catch(e=>{console.error('SUBSTRATE_INVENTORY_FAILED='+e.message);process.exitCode=1});
          NODE

      - name: Inspect real Hot Combo media and products (READ ONLY)
        shell: bash
        run: |
          node <<'NODE'
          const e=Object.fromEntries((process.env.ENV_FILE||'').split(/\r?\n/).map(s=>s.match(/^\s*(WC_URL|WC_URL_CLIENT)\s*=\s*(.*?)\s*$/)).filter(Boolean).map(m=>[m[1],m[2].replace(/^['"]|['"]$/g,'')]));
          if(e.WC_URL!=='https://admin.aquathanhxuan.io.vn'||e.WC_URL_CLIENT!=='https://aquathanhxuan.io.vn')throw Error('INVALID_SITE_ORIGIN');
          (async()=>{
            for(const term of ['combo','hot combo','bộ bể','trọn bộ','aquarium set']){
              for(const [kind,endpoint] of [
                ['media','/wp-json/wp/v2/media?per_page=50&_fields=id,title,source_url,alt_text&search='],
                ['products','/wp-json/wc/store/v1/products?per_page=50&search=']
              ]){
                const resp=await fetch(e.WC_URL+endpoint+encodeURIComponent(term),{headers:{accept:'application/json'},signal:AbortSignal.timeout(16000)});
                const body=await resp.json().catch(()=>null);
                const list=Array.isArray(body)?body:[];
                console.log('HOT_COMBO_INVENTORY='+JSON.stringify({kind,term,status:resp.status,total:resp.headers.get('x-wp-total'),
                  items:list.slice(0,25).map(x=>({id:x.id,name:x.name||x.title?.rendered||'',src:kind==='media'?x.source_url:x.images?.[0]?.src||'',alt:kind==='media'?x.alt_text:x.images?.[0]?.alt||'',permalink:kind==='products'?x.permalink:null}))}));
              }
            }
          })().catch(e=>{console.error('HOT_COMBO_DISCOVERY_FAILED='+e.message);process.exitCode=1});
          NODE
