name: Aqua light category verified WooCommerce product import
on:
  push:
    branches: [main]
    paths:
      - 'cms-requests/light-catalog-import.json'
permissions:
  contents: read
concurrency:
  group: aqua-light-catalog-writes
  cancel-in-progress: false
jobs:
  batch-0:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
      LIGHT_TARGET_SLUGS: den-weekaqua,den-chihiros,neo-helios,xuanmailong,kaokui,odyssea,den-phu-kien
      LIGHT_BATCH_COUNT: "3"
      LIGHT_BATCH: "light-0"
      LIGHT_BATCH_INDEX: "0"
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/aqua-light-catalog-migrate.py
      - name: Migrate source-only light Product identities and original assets
        run: python3 scripts/aqua-light-catalog-migrate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aqua-light-migration-0
          path: artifacts/aqua-light-migration/light-0.json
          if-no-files-found: ignore
          retention-days: 14
  batch-1:
    needs: [batch-0]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
      LIGHT_TARGET_SLUGS: den-weekaqua,den-chihiros,neo-helios,xuanmailong,kaokui,odyssea,den-phu-kien
      LIGHT_BATCH_COUNT: "3"
      LIGHT_BATCH: "light-1"
      LIGHT_BATCH_INDEX: "1"
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/aqua-light-catalog-migrate.py
      - name: Migrate source-only light Product identities and original assets
        run: python3 scripts/aqua-light-catalog-migrate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aqua-light-migration-1
          path: artifacts/aqua-light-migration/light-1.json
          if-no-files-found: ignore
          retention-days: 14
  batch-2:
    needs: [batch-1]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
      LIGHT_TARGET_SLUGS: den-weekaqua,den-chihiros,neo-helios,xuanmailong,kaokui,odyssea,den-phu-kien
      LIGHT_BATCH_COUNT: "3"
      LIGHT_BATCH: "light-2"
      LIGHT_BATCH_INDEX: "2"
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/aqua-light-catalog-migrate.py
      - name: Migrate source-only light Product identities and original assets
        run: python3 scripts/aqua-light-catalog-migrate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aqua-light-migration-2
          path: artifacts/aqua-light-migration/light-2.json
          if-no-files-found: ignore
          retention-days: 14
