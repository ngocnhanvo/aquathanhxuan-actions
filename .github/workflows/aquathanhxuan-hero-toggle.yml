name: Aqua Hero CMS toggle inspection one-shot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/aquathanhxuan-hero-toggle.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Inspect native ESC Table columns (NO WRITE)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage();
            await page.goto('https://admin.aquathanhxuan.io.vn/wp-login.php',{waitUntil:'domcontentloaded'});
            if(await page.locator('#user_login').count()){
              await page.locator('#user_login').fill(process.env.WP_ADMIN_USERNAME);
              await page.locator('#user_pass').fill(process.env.WP_ADMIN_PASSWORD);
              await page.locator('#wp-submit').click();
              await page.waitForURL(u=>u.pathname.startsWith('/wp-admin/'),{timeout:30000});
            }
            assert(page.url().startsWith('https://admin.aquathanhxuan.io.vn/wp-admin/'),'login');
            console.log('LOGIN_PASS');
            await page.goto('https://admin.aquathanhxuan.io.vn/wp-admin/admin.php?page=tablepress&action=edit&table_id=home_00',{waitUntil:'domcontentloaded'});
            const data=await page.evaluate(()=>({
              title:document.title, url:location.pathname+location.search,
              scripts:Object.keys(window).filter(x=>/tablepress|tableData|table_data|handsontable|jspreadsheet|wpApiSettings/i.test(x)).slice(0,35),
              buttons:[...document.querySelectorAll('button,input[type=button]')].map(e=>({id:e.id,txt:(e.textContent||e.value||'').trim().slice(0,60)})).filter(x=>x.id||x.txt).slice(0,65),
              content:document.querySelector('#wpbody-content')?.innerText.slice(0,2400),
              fields:[...document.querySelectorAll('[name]')].map(e=>e.name).filter(x=>/nonce|tablepress/.test(x)).slice(0,30),
            }));
            console.log('TABLE_EDITOR_INSPECTION='+JSON.stringify(data));
          } finally {await browser.close()}
          NODE
