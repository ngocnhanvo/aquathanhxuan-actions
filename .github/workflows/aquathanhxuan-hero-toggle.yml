name: Aqua Hero CMS toggle setup one-shot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/aquathanhxuan-hero-toggle.yml']
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Add show_text column to native ESC Table with readback
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage();
            await page.goto('https://admin.aquathanhxuan.io.vn/wp-login.php',{waitUntil:'domcontentloaded'});
            if(await page.locator('#user_login').count()){
              await page.locator('#user_login').fill(process.env.WP_ADMIN_USERNAME);
              await page.locator('#user_pass').fill(process.env.WP_ADMIN_PASSWORD);
              await page.locator('#wp-submit').click();
              await page.waitForURL(u=>u.pathname.startsWith('/wp-admin/'),{timeout:30000});
            }
            assert(page.url().startsWith('https://admin.aquathanhxuan.io.vn/wp-admin/'),'login');
            console.log('LOGIN_PASS');
            await page.goto('https://admin.aquathanhxuan.io.vn/wp-admin/admin.php?page=tablepress&action=edit&table_id=home_00',{waitUntil:'domcontentloaded'});
            await page.locator('#table-id').waitFor({state:'visible',timeout:30000});
            await page.waitForTimeout(5000);
            console.log('EDITOR_DIAGNOSTIC='+JSON.stringify(await page.evaluate(()=>({
              tpType:typeof window.tp, tpKeys:Object.keys(window.tp||{}).slice(0,25),
              editorType:typeof window.tp?.editor,
              editorKeys:Object.keys(window.tp?.editor||{}).slice(0,25),
              dataType:typeof window.tp?.editor?.options?.data,
              body:document.querySelector('#tablepress_edit-table-data')?.innerText.slice(0,300),
              scripts:[...document.querySelectorAll('script[src]')].map(s=>s.src.split('/').pop()).filter(x=>/edit|tablepress/i.test(x)).slice(0,15)
            }))));
            await page.waitForFunction(() => Array.isArray(window.tp?.editor?.getData?.()),null,{timeout:10000});
            const before=await page.evaluate(()=>window.tp.editor.getData());
            assert.equal(before.length,4,'Expected header, labels and 2 Hero rows');
            assert.equal(before[0].length,13,'Unexpected existing Hero schema');
            assert.equal(before[0][0],'image');
            assert.equal(before[0][2],'title');
            assert.equal(before[0][12],'link');
            const existing=before[0].indexOf('show_text');
            if(existing!==-1) {
              assert.equal(before[2][existing],'0','First banner expected hidden');
              console.log('CMS_HERO_TOGGLE=SKIP_ALREADY_CONFIGURED');
            } else {
              const after=before.map((row,i)=>[...row,i===0?'show_text':i===1?'Hiện chữ (1/0)':i===2?'0':'1']);
              assert(after.every(row=>row.length===14));
              await page.evaluate(next=>{
                const tp=window.tp;
                tp.editor.updateSelectionFromCoords(12,0,12,0);
                tp.helpers.selection={rows:[0],columns:[12]};
                tp.callbacks.insert_duplicate('insert','columns','after');
                if(tp.editor.getData()[0].length!==14) throw new Error('COLUMN_INSERT_FAILED');
                for(let row=0;row<next.length;row++){
                  tp.editor.setValueFromCoords(13,row,next[row][13]);
                }
                tp.helpers.unsaved_changes.set();
              },after);
              const changed=await page.evaluate(()=>window.tp.editor.getData());
              assert.equal(JSON.stringify(changed),JSON.stringify(after),'Editor mismatch');
              await page.getByRole('button',{name:/Save Changes|Lưu thay đổi/i}).first().click();
              await page.waitForFunction(()=>!window.tp?.made_changes,null,{timeout:30000});
              const response=await fetch('https://admin.aquathanhxuan.io.vn/wp-json/tablepress/v1/table/home_00?qa='+Date.now(),{headers:{'cache-control':'no-cache'}});
              assert.equal(response.status,200,'REST readback');
              const table=await response.json();
              assert.equal(table.items.length,2,'Expected 2 slides');
              assert.equal(String(table.items[0].show_text),'0','First banner overlay hidden');
              assert.equal(String(table.items[1].show_text),'1','Second banner overlay visible');
              for(let i=0;i<2;i++)assert(String(table.items[i].image).includes('cropped-banner-'),'Hero image preserved');
              console.log('CMS_HERO_TOGGLE=PASS field=show_text first=0 second=1 before_rows='+before.length+' before_cols=13');
            }
          } finally {await browser.close()}
          NODE
