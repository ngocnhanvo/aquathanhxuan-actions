name: Aqua import 10 verified Home 02 products and create ESC Table
# Rerun after confirming ACF product_lang is an object with value=vi.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aquathanhxuan-home02products-import-writer
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Import only independently verified legacy product records
        id: import
        run: python3 scripts/aquathanhxuan-home02products-migrate.py
      - name: Install matching Playwright driver
        if: success()
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Create native curated ESC Table from actual destination IDs
        if: success()
        id: table
        run: node scripts/aquathanhxuan-home02products-create.cjs
      - name: Persist independently readable final outcome
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const path='chatgpt/home02products-import-status.json';
            const mapping=fs.existsSync('chatgpt/home02products-migration.json')
              ? JSON.parse(fs.readFileSync('chatgpt/home02products-migration.json','utf8')) : null;
            const report={
              run_id:context.runId,source_sha:context.sha,
              imported_step:'${{ steps.import.outcome }}',
              table_step:'${{ steps.table.outcome }}',
              checked_at:new Date().toISOString(),
              mappings:mapping?.mappings||[]
            };
            const ref=context.ref.replace('refs/heads/','');
            const current=await github.rest.repos.getContent({
              owner:context.repo.owner,repo:context.repo.repo,path,ref
            }).catch(e=>e.status===404?null:Promise.reject(e));
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,branch:ref,
              message:'Record Home 02 verified product import outcome',
              content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64'),
              ...(current?.data?.sha?{sha:current.data.sha}:{})
            });
