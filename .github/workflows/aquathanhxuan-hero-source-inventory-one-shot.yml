name: Aqua hero source inventory one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-hero-source-inventory-one-shot.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - name: Inventory REST, media and legacy homepage hero candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.parse
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlsplit

          vals={}
          for line in os.environ.get('ENV_FILE','').splitlines():
              line=line.strip()
              if line.startswith('export '): line=line[7:].strip()
              m=re.match(r'^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$', line)
              if m: vals[m.group(1)]=m.group(2).strip().strip('"').strip("'")
          wp=vals.get('WC_URL','').rstrip('/')
          if urlsplit(wp).hostname != 'admin.aquathanhxuan.io.vn':
              raise SystemExit('Unexpected WordPress origin')

          def get_json(url):
              req=urllib.request.Request(url, headers={'User-Agent':'AquaHeroInventory/1.0'})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return json.load(r)

          root=get_json(wp+'/wp-json')
          for route,meta in sorted((root.get('routes') or {}).items()):
              if 'tablepress' in route.lower() or 'esc-table' in route.lower():
                  methods=sorted({m for ep in (meta.get('endpoints') or []) for m in (ep.get('methods') or [])})
                  print('ROUTE', json.dumps({'route':route,'methods':methods}, ensure_ascii=False))

          seen=set()
          for term in ('banner','slide','aquarium','thuy sinh','bể cá','be ca','aqua'):
              q=urllib.parse.urlencode({'search':term,'per_page':20,'orderby':'date','order':'desc'})
              try:
                  items=get_json(wp+'/wp-json/wp/v2/media?'+q)
              except Exception as e:
                  print('MEDIA_SEARCH_ERROR', term, type(e).__name__)
                  continue
              for m in items:
                  mid=m.get('id')
                  if mid in seen: continue
                  seen.add(mid)
                  src=((m.get('media_details') or {}).get('sizes') or {}).get('full',{}).get('source_url') or m.get('source_url')
                  print('MEDIA', json.dumps({
                      'id':mid,
                      'date':m.get('date'),
                      'slug':m.get('slug'),
                      'title':(m.get('title') or {}).get('rendered'),
                      'alt':m.get('alt_text'),
                      'src':src,
                      'caption':re.sub('<[^>]+>',' ',(m.get('caption') or {}).get('rendered') or '').strip()
                  }, ensure_ascii=False))

          legacy='https://aquathanhxuan.com/'
          req=urllib.request.Request(legacy, headers={'User-Agent':'Mozilla/5.0 AquaMigrationAudit/1.0'})
          with urllib.request.urlopen(req, timeout=25) as r:
              html=r.read().decode('utf-8','replace')

          cutoff=html.lower().find('sale bùng nổ')
          if cutoff < 0: cutoff=min(len(html),120000)
          head=html[:cutoff]
          for tag in re.findall(r'<img\b[^>]*>', head, flags=re.I):
              def attr(name):
                  m=re.search(r'\b'+re.escape(name)+r'\s*=\s*(?:"([^"]*)"|\'([^\']*)\'|([^\s>]+))',tag,flags=re.I)
                  return next((x for x in m.groups() if x is not None),'') if m else ''
              src=attr('src') or attr('data-src') or attr('data-lazy-src')
              srcset=attr('srcset') or attr('data-srcset')
              alt=attr('alt')
              if src:
                  print('LEGACY_IMG', json.dumps({'src':urljoin(legacy,src),'alt':alt,'srcset':srcset[:500]}, ensure_ascii=False))
          PY
