name: Aqua menu source inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-menu-inventory.yml'
      - 'scripts/aquathanhxuan-menu-inventory.mjs'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 5
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aquathanhxuan-menu-inventory.mjs
