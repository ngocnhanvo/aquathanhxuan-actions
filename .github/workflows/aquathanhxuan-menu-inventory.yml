name: Aqua menu source inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-menu-inventory.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/aquathanhxuan-menu-inventory.mjs
