name: Aqua order history native ESC Table install (CMS only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aqua-order-history-esc-table-install.yml'
      - 'scripts/aqua-order-history-esc-table-install.cjs'
permissions:
  contents: read
concurrency:
  group: aqua-order-history-cms-page
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check scripts/aqua-order-history-esc-table-install.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Create only order_history_vi table and insert via native WordPress Insert Code
        run: node scripts/aqua-order-history-esc-table-install.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-order-history-native-esc
          path: artifacts/aqua-order-history-esc-table/
          if-no-files-found: ignore
          retention-days: 14
