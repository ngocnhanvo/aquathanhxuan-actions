name: Aqua brand listing and WooCommerce detail price unit QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aqua-brand-products-unit-qa.yml'
      - 'qa-requests/brand-products-unit.json'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      - name: Check exact Astro source commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bc1ebedbe4ed0df5dd180c8f3fa38debc9e9b62d
          echo "AQUA_BRAND_SOURCE_SHA=$(git rev-parse HEAD)"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run src/lib/wordpress/products/catalogSort.test.ts src/lib/seo/listingTitles.test.ts src/lib/wordpress/products/detailPrice.test.ts
      - run: node --test scripts/atman-redirect-rule.test.mjs
