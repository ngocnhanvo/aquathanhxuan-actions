name: Aqua Sale visual production QA one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-sale-visual-qa.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - name: Install matching Playwright driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify Sale UI on production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/sale
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const origin='https://aquathanhxuan.io.vn';
          const expected='197a54fcddb77c02d5d986f71cdc92b14c403341';
          const cases=[[1440,900],[1024,768],[768,1024],[844,390],[390,844]];

          (async()=>{
            const marker=await fetch(origin+'/aquathanhxuan-staging-build.json?qa='+Date.now(),{
              headers:{'cache-control':'no-cache'}
            });
            assert.equal(marker.status,200,'Production marker HTTP');
            const meta=await marker.json();
            assert.equal(meta.commit,expected,'Production deploy SHA');

            const pageJsonResponse=await fetch(origin+'/data/page-default.json?qa='+Date.now(),{
              headers:{'cache-control':'no-cache'}
            });
            assert.equal(pageJsonResponse.status,200,'Production homepage JSON HTTP');
            const pageJson=await pageJsonResponse.json();
            assert(String(pageJson?.content||'').includes('[table id=home_01 /]'),'Production homepage JSON has home_01');
            const shortcodes=(Array.isArray(pageJson?.contents)?pageJson.contents:[]).map(x=>String(x?.shortcode||'').toLowerCase());
            assert(shortcodes.includes('home_01'),'Production homepage contents has home_01');
            console.log('SALE_DATA_CHAIN=PASS shortcodes='+shortcodes.join(','));

            const browser=await chromium.launch({headless:true});
            try{
              for(const [width,height] of cases){
                const page=await browser.newPage({viewport:{width,height}});
                await page.goto(origin+'/?sale_visual_qa='+Date.now(),{
                  waitUntil:'domcontentloaded',
                  timeout:45000
                });

                const sale=page.locator('[data-aqua-home-sale]');
                await sale.waitFor({state:'visible',timeout:20000});
                assert.equal((await sale.locator('h2').innerText()).trim(),'Sale bùng nổ','Sale heading');

                const cards=sale.locator('[data-sale-card]');
                assert.equal(await cards.count(),12,'Sale product card count');
                assert.equal(await sale.locator('.aqua-sale__discount').count(),12,'Discount badge count');
                assert.equal(await sale.locator('.aqua-sale__prices strong').count(),12,'Sale price count');
                assert.equal(await sale.locator('.aqua-sale__prices del').count(),12,'Regular price count');
                assert.equal(await sale.locator('[data-sale-add]').count(),12,'Cart button count');

                const images=sale.locator('[data-sale-card] img');
                assert.equal(await images.count(),12,'Product image count');

                const initialImageStates=await images.evaluateAll(nodes=>nodes.map((img,index)=>({
                  index,
                  src:img.getAttribute('src')||'',
                  currentSrc:img.currentSrc||'',
                  complete:img.complete,
                  naturalWidth:img.naturalWidth,
                  naturalHeight:img.naturalHeight,
                })));
                console.log('SALE_IMAGE_INITIAL='+JSON.stringify(initialImageStates));

                // Product images are intentionally loading="lazy". Cards outside the
                // horizontal viewport are not expected to load until the carousel
                // scrolls near them, so reveal each card before asserting image health.
                for(let i=0;i<12;i++){
                  const card=cards.nth(i);
                  const img=images.nth(i);
                  await card.evaluate(el=>el.scrollIntoView({behavior:'instant',block:'nearest',inline:'center'}));
                  const handle=await img.elementHandle();
                  assert(handle,'Product image handle '+i);
                  try{
                    await page.waitForFunction(
                      el=>Boolean(el && el.complete && el.naturalWidth>0),
                      handle,
                      {timeout:10000}
                    );
                  }catch(error){
                    const broken=await img.evaluate(el=>({
                      src:el.getAttribute('src')||'',
                      currentSrc:el.currentSrc||'',
                      complete:el.complete,
                      naturalWidth:el.naturalWidth,
                      naturalHeight:el.naturalHeight,
                    }));
                    console.log('SALE_IMAGE_BROKEN index='+i+' state='+JSON.stringify(broken));
                    await sale.screenshot({path:'artifacts/sale/broken-'+width+'x'+height+'-'+i+'.png'});
                    throw error;
                  }
                }

                const imageStates=await images.evaluateAll(nodes=>nodes.map((img,index)=>({
                  index,
                  src:img.getAttribute('src')||'',
                  currentSrc:img.currentSrc||'',
                  complete:img.complete,
                  naturalWidth:img.naturalWidth,
                  naturalHeight:img.naturalHeight,
                })));
                console.log('SALE_IMAGE_FINAL='+JSON.stringify(imageStates));
                assert(imageStates.every(img=>img.complete && img.naturalWidth>0),'All Sale images load after reveal');
                assert(imageStates.every(img=>!(img.currentSrc||img.src).includes('aquathanhxuan.com/wp-content/')),
                  'Production must not hotlink legacy product images');

                await sale.locator('[data-sale-track]').evaluate(el=>{el.scrollLeft=0;});
                await page.waitForTimeout(150);

                const discounts=await sale.locator('.aqua-sale__discount').allTextContents();
                assert(discounts.every(value=>/^\s*-\d+%\s*$/.test(value)),'Discount labels');

                const hrefs=await sale.locator('.aqua-sale__name-link').evaluateAll(nodes=>nodes.map(a=>a.getAttribute('href')));
                assert.equal(hrefs.length,12,'Product href count');
                assert(hrefs.every(href=>href && href!=='#'),'Product hrefs are real');

                const layout=await page.evaluate(()=>({
                  pageScroll:document.documentElement.scrollWidth,
                  viewport:window.innerWidth,
                  section:(()=>{
                    const el=document.querySelector('[data-aqua-home-sale]');
                    if(!el) return null;
                    const r=el.getBoundingClientRect();
                    return {top:r.top,bottom:r.bottom,width:r.width};
                  })(),
                  track:(()=>{
                    const el=document.querySelector('[data-aqua-home-sale] [data-sale-track]');
                    return el ? {scroll:el.scrollWidth,client:el.clientWidth,left:el.scrollLeft} : null;
                  })()
                }));
                assert(layout.pageScroll<=layout.viewport+1,'No horizontal page overflow');
                assert(layout.track && layout.track.scroll>layout.track.client,'Sale carousel must be scrollable');

                if(width>=768){
                  const next=sale.locator('[data-sale-next]');
                  const before=await sale.locator('[data-sale-track]').evaluate(el=>el.scrollLeft);
                  await next.click();
                  await page.waitForTimeout(450);
                  const after=await sale.locator('[data-sale-track]').evaluate(el=>el.scrollLeft);
                  assert(after>before,'Next arrow advances carousel');
                }

                const label=width+'x'+height;
                await sale.screenshot({path:'artifacts/sale/'+label+'.png'});
                console.log('SALE_QA_VIEWPORT=PASS '+label+' cards=12 track='+layout.track.client+'/'+layout.track.scroll);
                await page.close();
              }
            } finally {
              await browser.close();
            }
            console.log('SALE_VISUAL_QA=PASS source='+expected);
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Upload Sale QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquathanhxuan-sale-visual-qa
          path: artifacts/sale
          if-no-files-found: ignore
          retention-days: 7
