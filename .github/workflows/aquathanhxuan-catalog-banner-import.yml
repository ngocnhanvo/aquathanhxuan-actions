name: Aqua import real category banners into native ESC Table
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-catalog-banner-import.yml'
      - 'cms-requests/catalog-banner.json'
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/aquathanhxuan-catalog-banner-import.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node scripts/aquathanhxuan-catalog-banner-import.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aqua-catalog-banner-cms
          path: artifacts/category-banner
          if-no-files-found: ignore
          retention-days: 7
