name: Aqua Home 04 homepage native Insert Code
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-home04-insert-code.yml'
      - 'scripts/aquathanhxuan-home04-insert-code.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aquathanhxuan-home04-homepage-write
  cancel-in-progress: false
jobs:
  insert-code:
    if: github.repository == 'ngocnhanvo/aquathanhxuan-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Home 04 native Insert Code syntax
        run: node --check scripts/aquathanhxuan-home04-insert-code.cjs
      - name: Install matching Playwright driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Insert Home 04 without touching other homepage sections
        run: node scripts/aquathanhxuan-home04-insert-code.cjs
