name: Aqua category layout source tests
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-category-layout-source-qa.yml'
      - 'qa-requests/category-layout-source.json'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout Astro source master
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run category sort unit tests
        run: pnpm exec vitest run src/lib/wordpress/products/catalogSort.test.ts
      - name: Verify Astro components and TS
        run: pnpm exec astro check
