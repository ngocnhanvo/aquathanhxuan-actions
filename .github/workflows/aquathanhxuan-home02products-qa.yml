name: Aqua Home 02 curated products production acceptance
# Verify product archive navigation and the live WordPress category count.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-home02products-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aquathanhxuan-home02products-acceptance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Playwright driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify real ESC Table, frontend products, sidebar and Builder
        id: qa
        run: node scripts/aquathanhxuan-home02products-qa.cjs
      - name: Preserve viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquathanhxuan-home02products-qa
          path: artifacts/home02products
          if-no-files-found: ignore
      - name: Record Home 02 real production QA outcome
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const path='chatgpt/home02products-live.json';
            const data=fs.existsSync(path)?JSON.parse(fs.readFileSync(path,'utf8')):{error:'QA report missing'};
            data.run_id=context.runId;data.outcome='${{ steps.qa.outcome }}';
            const ref=context.ref.replace('refs/heads/','');
            const prev=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref})
              .catch(e=>e.status===404?null:Promise.reject(e));
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,branch:ref,
              message:'Record Home 02 production QA result',
              content:Buffer.from(JSON.stringify(data,null,2)+'\n').toString('base64'),
              ...(prev?.data?.sha?{sha:prev.data.sha}:{})
            });
