name: Aqua equipment products guarded CMS migration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquathanhxuan-equipment-products-migrate.yml'
      - 'scripts/aquathanhxuan-equipment-products-migrate.py'
      - 'scripts/aquathanhxuan-equipment-sections-create.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aquathanhxuan-equipment-cms-writes
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'ngocnhanvo/aquathanhxuan-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/aquathanhxuan-equipment-products-migrate.py
      - name: Import real legacy products and scoped child taxonomy
        run: python3 scripts/aquathanhxuan-equipment-products-migrate.py
      - name: Keep import mapping for subsequent CMS writer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-products-mapping
          path: chatgpt/equipment-products-migration.json
          if-no-files-found: ignore
  sections:
    needs: [migrate]
    if: github.repository == 'ngocnhanvo/aquathanhxuan-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: equipment-products-mapping
          path: mapping-artifact
      - run: node --check scripts/aquathanhxuan-equipment-sections-create.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Create linked equipment sections through native WordPress editor
        run: node scripts/aquathanhxuan-equipment-sections-create.cjs
